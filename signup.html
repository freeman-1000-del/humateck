<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Your 7-Day Free Trial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:760px;max-width:calc(100vw - 40px);margin:0 auto;padding:34px 0 70px}.card{border:1px solid rgba(214,176,78,.72);border-radius:24px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:30px 34px;box-shadow:0 18px 46px rgba(0,0,0,.28)}h1{color:#f4c95c;margin-top:0}p{line-height:1.75;color:#e6e0d4}.btn{display:inline-flex;align-items:center;justify-content:center;min-width:210px;min-height:52px;padding:12px 20px;border:2px solid #d9b256;border-radius:14px;color:#fff;font-size:17px;font-weight:900;background:linear-gradient(180deg,#5c4315,#15110a);cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.yellow{color:#ffd95a;font-weight:900}label{display:block;margin-top:18px;margin-bottom:8px;color:#ffd95a;font-weight:900}input{width:100%;padding:15px;background:#050b14;color:#f7f1e6;border:1px solid #4b5d6d;border-radius:12px;font-size:18px}.subtle{font-size:14px;color:#cfc8b9}.notice{border:1px solid rgba(214,176,78,.48);border-radius:16px;padding:14px;background:rgba(214,176,78,.1);color:#f0dfb4;line-height:1.7;margin-top:14px;white-space:pre-wrap}.hidden{display:none!important}.confirmBox{border:1px solid rgba(255,217,90,.7);border-radius:16px;padding:16px;margin-top:16px;background:rgba(255,217,90,.09);line-height:1.7}.confirmBox strong{color:#ffd95a}.continueBtn{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1 id="pageTitle">Start Your 7-Day Free Trial</h1>
    <p id="selectedPlanText" class="yellow">15-country subtitle registration.</p>
    <p id="pageGuide">Choose your saved email from this device and start simply.</p>

    <label for="memberEmail">Email</label>
    <input id="memberEmail" type="email" name="email" autocomplete="email" inputmode="email" placeholder="your@email.com">
    <p class="subtle">Your browser may show saved email suggestions when you click this field.</p>

    <div class="actions">
      <button id="startBtn" class="btn" type="button">Start Free Trial</button>
      <a class="btn" href="plans.html">Back to Plans</a>
    </div>
    <div id="startStatus" class="notice hidden"></div>
    <div id="trialConfirmBox" class="confirmBox hidden">
      <p><strong>Free trial activated.</strong></p>
      <p id="trialConfirmText"></p>
      <a id="continueOrderBtn" class="btn continueBtn" href="order.html">Continue to Order Page</a>
    </div>
  </section>
</div>

<script>
(function(){
  function $(id){return document.getElementById(id);}
  function param(name){return new URLSearchParams(window.location.search).get(name)||"";}
  function isEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||"").trim());}
  function showStatus(text){var box=$("startStatus"); if(box){box.textContent=text; box.classList.remove("hidden");}}
  function save(key,value){try{localStorage.setItem(key,String(value));}catch(e){}}
  function formatKst(ms){
    var d = new Date(ms + 9*60*60*1000);
    function pad(n){return String(n).padStart(2,"0");}
    return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())+" "+pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())+":"+pad(d.getUTCSeconds())+" KST";
  }
  var plan = param("plan") || "free7";
  var labels = {
    free7:"15-country subtitle registration.",
    monthly30:"30-country subtitle registration.",
    monthly50:"50-country subtitle registration.",
    monthly70:"70-country subtitle registration.",
    monthly83:"83-country subtitle registration.",
    yearly83:"83-country subtitle registration annual plan."
  };
  var titles = {
    free7:"Start Your 7-Day Free Trial",
    monthly30:"Continue with 30-Country Plan",
    monthly50:"Continue with 50-Country Plan",
    monthly70:"Continue with 70-Country Plan",
    monthly83:"Continue with 83-Country Plan",
    yearly83:"Continue with Annual Plan"
  };
  var paypal = {
    monthly30:"https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-0NR97490A8670131FNH6DHPA",
    monthly50:"https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-86V63300B15314135NH6ENDQ",
    monthly70:"https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-752827993G859572ANH6EHKQ",
    monthly83:"https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-6E5334011V329504ENH6D6II",
    yearly83:"https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-9AN12524W12053819NH6ER3Y"
  };
  if($("pageTitle")) $("pageTitle").textContent = titles[plan] || titles.free7;
  if($("selectedPlanText")) $("selectedPlanText").textContent = labels[plan] || labels.free7;
  if($("startBtn")) $("startBtn").textContent = plan === "free7" ? "Start Free Trial" : "Continue";

  document.addEventListener("click",function(e){
    if(!e.target || e.target.id !== "startBtn") return;
    e.preventDefault();
    var email = ($("memberEmail") && $("memberEmail").value || "").trim().toLowerCase();
    if(!isEmail(email)){showStatus("Please enter a valid email address."); return;}

    save("humateckVerifiedEmail",email);
    save("humateckSelectedPlan",plan);

    if(plan === "free7"){
      var startMs = Date.now();
      var endMs = startMs + 7*24*60*60*1000;
      save("humateckActivePlan","free7");
      save("humateckSubscriberPlan","free7");
      save("humateckPaymentSubscriptionPlan","free7");
      save("humateckFreeTrialActive","true");
      save("humateckFreeTrialStartMs",startMs);
      save("humateckFreeTrialEndMs",endMs);
      var input = $("memberEmail");
      var btn = $("startBtn");
      if(input) input.disabled = true;
      if(btn) btn.disabled = true;
      showStatus("Your 7-day free trial has been created for " + email + ".");
      var confirmBox = $("trialConfirmBox");
      var confirmText = $("trialConfirmText");
      if(confirmText){
        confirmText.textContent = "Plan: 7-Day Free Trial / 15-country subtitle registration. Ends at: " + formatKst(endMs);
      }
      if(confirmBox) confirmBox.classList.remove("hidden");
      return;
    }

    if(paypal[plan]){
      window.location.href = paypal[plan];
      return;
    }

    window.location.href = "order.html";
  });
})();
</script>
</body>
</html>
