<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>요금제 안내 - Humateck</title>
    <style>
        body { font-family: sans-serif; padding: 50px; background: #fafafa; }
        .plan-header { text-align: right; margin-bottom: 30px; }
        .plans-grid { display: flex; gap: 20px; justify-content: center; }
        .plan-card { border: 1px solid #ddd; padding: 30px; border-radius: 10px; background: #fff; width: 300px; text-align: center; }
        .btn-nav { background: #333; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 5px; }
        .btn-wait { background: #ccc; color: #666; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="plan-header">
        <a href="order.html" class="btn-nav">주문페이지 바로가기</a>
    </div>

    <div class="plans-grid">
        <div class="plan-card">
            <h2>Basic</h2>
            <p>월 10회 등록</p>
            <button class="btn-wait">서비스 준비중</button>
        </div>
        <div class="plan-card">
            <h2>Premium</h2>
            <p>무제한 등록</p>
            <button class="btn-wait">서비스 준비중</button>
        </div>
    </div>
    </body>
</html>
