<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>등록 플랜 - Humateck</title>
    <style>
        body { background:#050b14; color:#f4f1e8; font-family:sans-serif; text-align:center; padding:50px; }
        .header-nav { text-align:right; margin-bottom:30px; }
        .btn-nav { color:#ffd95a; text-decoration:none; border:1px solid #ffd95a; padding:8px 15px; border-radius:5px; }
        .plans { display:flex; gap:20px; justify-content:center; margin-top:40px; }
        .plan-box { border:1px solid rgba(214,176,78,.5); padding:30px; border-radius:20px; width:250px; background:#141c25; }
        .btn-wait { background:#444; color:#888; border:none; padding:10px; width:100%; border-radius:5px; cursor:not-allowed; }
    </style>
</head>
<body>
    <div class="header-nav">
        <a href="order.html" class="btn-nav">주문페이지 바로가기</a>
    </div>
    <h1>전체 등록플랜</h1>
    <div class="plans">
        <div class="plan-box">
            <h3>Standard</h3>
            <p>월 30회 번역/등록</p>
            <button class="btn-wait">서비스 준비중</button>
        </div>
        <div class="plan-box">
            <h3>Premium</h3>
            <p>무제한 번역/등록</p>
            <button class="btn-wait">서비스 준비중</button>
        </div>
    </div>
</body>
</html>
