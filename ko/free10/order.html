<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 자막 등록</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea{font-family:inherit}
.wrap{width:1180px;max-width:calc(100vw - 48px);margin:0 auto;padding:24px 0 60px}
/* 로고와 우측 타이틀이 수평으로 알맞게 정렬되도록 정비 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.logo{width:210px;height:auto;display:block}
.lang{border:1px solid rgba(214,176,78,.55);border-radius:999px;padding:8px 14px;color:#e8d8a8;background:rgba(255,255,255,.03)}
.hero{position:relative;overflow:hidden;border:1px solid rgba(214,176,78,.72);border-radius:30px;background:radial-gradient(circle at 68% 20%,rgba(75,151,255,.24),transparent 35%),radial-gradient(circle at 30% 42%,rgba(214,176,78,.18),transparent 35%),linear-gradient(180deg,#0b1423,#070b11);min-height:520px;padding:38px 38px 32px;box-shadow:0 22px 70px rgba(0,0,0,.46)}
.heroText{text-align:center;position:relative;z-index:2;padding-top:12px}
.kicker{color:#6ca6ff;font-weight:800;font-size:18px;margin-bottom:12px}
.title{margin:0;color:#4b97ff;font-size:44px;line-height:1.25;font-weight:900;text-shadow:0 0 24px rgba(70,140,255,.22)}
.subtitle{margin:16px 0 0;color:#fff;font-size:21px;font-weight:800}
.stage{position:relative;width:840px;height:275px;max-width:100%;margin:36px auto 0}
.globe{position:absolute;left:50%;top:32px;width:230px;height:230px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(93,160,255,.72);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.33),transparent 12%),radial-gradient(circle at 50% 50%,rgba(58,126,255,.42),rgba(4,18,45,.9) 67%),repeating-linear-gradient(90deg,transparent 0 19px,rgba(116,178,255,.19) 20px 21px),repeating-linear-gradient(0deg,transparent 0 19px,rgba(116,178,255,.15) 20px 21px);box-shadow:0 0 48px rgba(83,144,255,.38)}
.play{position:absolute;left:50%;top:92px;width:116px;height:82px;transform:translateX(-50%);border-radius:22px;background:linear-gradient(145deg,#ffe083,#b98217);box-shadow:0 0 42px rgba(235,180,62,.72)}
.play:after{content:"";position:absolute;left:45px;top:22px;border-left:34px solid #1a1307;border-top:20px solid transparent;border-bottom:20px solid transparent}
.vcard{position:absolute;width:210px;height:118px;border:1px solid rgba(214,176,78,.62);border-radius:18px;background:rgba(10,17,27,.82);box-shadow:0 16px 38px rgba(0,0,0,.45);padding:17px}
.vcard.left{left:0;top:82px}.vcard.right{right:0;top:82px}.vcard.bottom{left:50%;bottom:0;transform:translateX(-50%)}
.line{height:9px;border-radius:99px;background:rgba(255,255,255,.18);margin-bottom:10px}.line.gold{width:70%;background:rgba(236,190,74,.9)}.line.blue{width:82%;background:rgba(76,144,255,.75)}
.dots span{position:absolute;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0cf6a,#594118);box-shadow:0 0 22px rgba(235,190,80,.45)}
.dots span:nth-child(1){left:250px;top:32px}.dots span:nth-child(2){right:250px;top:32px}.dots span:nth-child(3){left:290px;bottom:22px}.dots span:nth-child(4){right:290px;bottom:22px}
.sectionTitle{text-align:center;color:#ffd95a;font-size:30px;font-weight:900;margin:34px 0 20px}
.card{border:1px solid rgba(214,176,78,.72);border-radius:24px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:30px 34px;margin-bottom:24px;box-shadow:0 18px 46px rgba(0,0,0,.28)}
.card h1,.card h2,.card h3{color:#f4c95c}.card h1{font-size:38px;margin-top:0}.card h2{font-size:26px;margin:0 0 16px}.card h3{font-size:21px;margin:18px 0 10px}
.card p,.card li{color:#e6e0d4;line-height:1.78;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 390px;gap:26px;align-items:stretch}
.sidebox{border:1px solid rgba(214,176,78,.48);border-radius:20px;background:rgba(5,11,19,.72);padding:24px}
.monitor{width:88px;height:58px;border:3px solid #e4bd55;border-radius:8px;margin-bottom:18px;position:relative}.monitor:after{content:"";position:absolute;right:-42px;top:-15px;width:45px;height:34px;border-radius:50%;border:3px solid #e4bd55}
.actions{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:250px;min-height:58px;padding:14px 24px;border:2px solid #d9b256;border-radius:14px;color:#fff;font-size:20px;font-weight:900;background:linear-gradient(180deg,#5c4315,#15110a);box-shadow:inset 0 0 18px rgba(255,220,120,.12)}
.btn.disabled{opacity:.45;cursor:not-allowed;background:#272c33;border-color:#59616d;color:#bcc3cd}
.footer{display:flex;justify-content:center;gap:20px;margin-top:28px;color:#cfc8b9;font-size:15px}
.account{position:fixed;left:22px;bottom:22px;z-index:20;display:flex;gap:9px;padding:9px 13px;background:rgba(8,12,18,.94);border:1px solid rgba(214,176,78,.46);border-radius:999px}
.account a{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(214,176,78,.38);font-weight:900}
.gear{position:fixed;right:24px;bottom:24px;z-index:40}
.gear summary{list-style:none;width:72px;height:72px;border-radius:50%;border:2px solid #e5bd55;background:#080b10;color:#e5bd55;font-size:37px;cursor:pointer;display:flex;align-items:center;justify-content:center}.gear summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;bottom:86px;width:245px;border:1px solid rgba(214,176,78,.62);border-radius:18px;background:rgba(14,18,24,.98);padding:14px 18px;box-shadow:0 18px 45px rgba(0,0,0,.55)}
.menu a{display:block;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:17px}.menu a:last-child{border-bottom:0}.danger{color:#ff6b5d}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.plan{border:1px solid rgba(214,176,78,.72);border-radius:22px;background:rgba(16,23,31,.94);padding:26px 22px;min-height:315px;display:flex;flex-direction:column}.price{color:#fff;font-size:30px;font-weight:900;margin:16px 0}.plan .btn{min-width:0;width:100%;font-size:17px;margin-top:auto}
.order{display:grid;grid-template-columns:190px 1fr 310px;gap:18px;align-items:start}.side,.right{border:1px solid rgba(214,176,78,.56);border-radius:20px;background:rgba(16,23,31,.95);padding:20px}.side a{display:block;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.1)}.side a:last-child{border-bottom:0}
input,textarea{width:100%;padding:14px;background:#050b14;color:#f7f1e6;border:1px solid #4b5d6d;border-radius:12px;font-size:15px;margin:8px 0 14px}textarea{min-height:300px;line-height:1.72;resize:vertical}
.notice{border:1px solid rgba(214,176,78,.48);border-radius:16px;padding:16px;background:rgba(214,176,78,.1);color:#f0dfb4;line-height:1.7;margin-top:14px}
.faqItem{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:14px}
.codebox
