<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humateck 다국어 전송 센터</title>
<style>
    body { background: #050b14; color: #f4f1e8; font-family: Arial, sans-serif; padding: 20px; }
    .country-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
    .country-item { border: 1px solid #333; padding: 8px; border-radius: 5px; font-size: 12px; }
    button { background: #d6b04e; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 8px; }
</style>
</head>
<body>

<div class="wrap">
    <h1>Humateck 국가 선택 전송</h1>
    
    <div class="country-grid" id="countryList">
        <label class="country-item"><input type="checkbox" value="US"> 미국 (US)</label>
        <label class="country-item"><input type="checkbox" value="GB"> 영국 (GB)</label>
        <label class="country-item"><input type="checkbox" value="JP"> 일본 (JP)</label>
        </div>

    <button id="youtubeRegisterBtn">선택 국가 즉시 등록</button>
</div>

<script>
    // 전송 로직: 복잡한 판단 없이 오직 선택된 국가만 전송
    document.getElementById('youtubeRegisterBtn').addEventListener('click', function() {
        var selectedCountries = [];
        var checkboxes = document.querySelectorAll('#countryList input:checked');
        
        checkboxes.forEach(function(cb) {
            selectedCountries.push(cb.value);
        });

        if(selectedCountries.length === 0) {
            alert("전송할 국가를 선택해주세요.");
            return;
        }

        console.log("전송 시작:", selectedCountries);
        // 여기서 바로 전송 함수 호출 (예: startUpload(selectedCountries))
    });
</script>

</body>
</html>
