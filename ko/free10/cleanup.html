<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humateck Free Trial Cleanup</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{width:760px;max-width:calc(100vw - 40px);margin:80px auto;padding:32px;border:1px solid rgba(214,176,78,.72);border-radius:22px;background:#111923}
h1{color:#ffd95a;margin-top:0}
p{font-size:17px;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border:2px solid #d9b256;border-radius:12px;color:#fff;text-decoration:none;font-weight:900;background:linear-gradient(180deg,#5c4315,#15110a)}
.done{color:#7dff9d;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
<h1>Free Trial State Cleanup</h1>
<p class="done">Cleanup completed.</p>
<p>This page removes old shared free-trial browser values that could affect the root order page.</p>
<p>The English free-trial flow must remain inside <b>/free/</b> only.</p>
<p><a class="btn" href="/order.html">Go to Main Order Page</a></p>
</div>
<script>
(function(){
  var keys = [
    "humateckFreeTrialActive",
    "humateckFreeTrialStartMs",
    "humateckFreeTrialEndMs",
    "humateckActivePlan",
    "humateckSubscriberPlan",
    "humateckAdminSelectedPlan",
    "humateckPaymentSubscriptionPlan"
  ];
  for(var i=0;i<keys.length;i++){
    try{ localStorage.removeItem(keys[i]); }catch(e){}
  }
})();
</script>
</body>
</html>
