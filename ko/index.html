<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제미나이 다국어 번역</title>
<meta name="description" content="국가를 선택하고 제미나이 프롬프트를 생성·복사한 뒤, 결과를 붙여넣으세요.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:"Noto Sans KR",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit}
.wrap{width:900px;max-width:calc(100vw - 32px);margin:0 auto;padding:24px 0 80px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:900;color:#ffd95a;letter-spacing:.02em}
.langSwitch{display:flex;gap:10px;align-items:center;font-size:14px;color:#cfc8b9}
.langSwitch a{opacity:.75}
.langSwitch a.on{opacity:1;color:#ffd95a;font-weight:800}
.card{
  border:1px solid rgba(214,176,78,.72);border-radius:24px;
  background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));
  padding:28px 30px;margin-bottom:20px;box-shadow:0 18px 46px rgba(0,0,0,.28);
}
.card h1,.card h2{color:#f4c95c;margin:0 0 14px}
.card h1{font-size:28px}
.card h2{font-size:20px}
label{display:block;margin:10px 0 6px;color:#ffd95a;font-weight:800}
input,textarea,select{
  width:100%;padding:14px;background:#050b14;color:#f7f1e6;
  border:1px solid #4b5d6d;border-radius:12px;font-size:15px;margin:0 0 12px;
}
textarea{min-height:160px;line-height:1.72;resize:vertical}
#geminiPromptText,#finalOutput{min-height:220px}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:52px;
  padding:12px 20px;border:2px solid #d9b256;border-radius:14px;color:#fff;font-size:17px;font-weight:900;
  background:linear-gradient(180deg,#5c4315,#15110a);cursor:pointer;
}
.btn.secondary{background:#121722;border-color:#4b5d6d}
.copyStatus{min-height:22px;color:#8dffb0;font-weight:800;text-align:center;margin:8px 0 0}
.commandFullItem{margin-bottom:12px}
.commandFullTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.commandFullTop label{margin:0}
.commandFullTop .btn{min-width:90px;min-height:40px;font-size:14px;padding:8px 12px}
.commandFullItem textarea{min-height:72px;margin-bottom:0}
.planPickerControls select{margin-bottom:0}
.hint{margin:0 0 12px;color:#aeb6c4;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/ko/">제미나이 번역</a>
    <nav class="langSwitch" aria-label="언어">
      <a href="/" hreflang="en">EN</a>
      <span>|</span>
      <a class="on" href="/ko/" hreflang="ko">한국어</a>
    </nav>
  </div>

  <section class="card">
    <h1>제미나이 다국어 번역</h1>
    <label for="orderPlanSelect">배포 국가 수 선택</label>
    <div class="planPickerControls" id="planPickerSection">
      <select id="orderPlanSelect" aria-label="배포 국가 수 선택">
        <option value="">배포 국가 수를 선택하세요…</option>
        <option value="asia30">아시아 플랜 (30개국)</option>
        <option value="europe30">유럽 플랜 (30개국)</option>
        <option value="africa30">아프리카 플랜 (30개국)</option>
        <option value="america30">아메리카 플랜 (30개국)</option>
        <option value="oceania30">오세아니아 플랜 (30개국)</option>
        <option value="global16">글로벌 16개국</option>
        <option value="global50">글로벌 50개국</option>
        <option value="global70">글로벌 70개국</option>
      </select>
    </div>
    <input type="hidden" id="humateckActivePlanValue" value="">
    <input type="hidden" id="humateckActiveCountryLimit" value="">

    <label for="sourceTitle">원문 제목</label>
    <input id="sourceTitle" type="text" placeholder="원문 제목을 입력하세요">

    <label for="sourceDescription">원문 설명</label>
    <textarea id="sourceDescription" placeholder="원문 설명을 입력하세요"></textarea>

    <div class="actions">
      <button class="btn" type="button" id="generateGeminiPrompt">제미나이 요청 프롬프트 생성</button>
    </div>
  </section>

  <section id="gemini" class="card">
    <h2>제미나이 요청 프롬프트</h2>
    <p class="hint">프롬프트·커맨드 본문은 검증된 영문 그대로입니다. 복사해서 제미나이에 붙여넣으세요.</p>
    <textarea id="geminiPromptText" readonly>Hello Gemini!
Without any explanation, output only the translated registration text.

Translate the following YouTube title and description for the {activeCount}-country set.
Continue from beginning to end without stopping.

[Source Text]
Title:
{sourceTitle}

Description:
{sourceDescription}

[Output Format]
Number:
Country Code:
Country Name:
Title:
Description:

Without any explanation, output only the translated registration text.

[Country Code List]
{countryBlock}

Without any explanation, output only the translated registration text.</textarea>
    <div class="actions">
      <button class="btn" type="button" data-copy-target="geminiPromptText">프롬프트 복사</button>
      <a class="btn secondary" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">제미나이 열기</a>
    </div>
    <p id="geminiCopyStatus" class="copyStatus"></p>
  </section>

  <section class="card" id="geminiCommandCard">
    <h2>제미나이 커맨드</h2>
    <div class="commandFullRows">
      <div class="commandFullItem"><div class="commandFullTop"><label>커맨드 1</label><button class="btn" type="button" data-copy-target="commandText1">복사</button></div><textarea id="commandText1" readonly>Please automatically and carefully check for mixed-in other languages, unnatural context, and any other issues.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>커맨드 2</label><button class="btn" type="button" data-copy-target="commandText2">복사</button></div><textarea id="commandText2" readonly>Please delete the Number: , Country Name:.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>커맨드 3</label><button class="btn" type="button" data-copy-target="commandText4">복사</button></div><textarea id="commandText4" readonly>Carefully check once more for mixed-in other languages, unnatural context, and any other issues.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>커맨드 4</label><button class="btn" type="button" data-copy-target="commandText5">복사</button></div><textarea id="commandText5" readonly>Please remove all of Gemini's explanations and commentaries, and output it again.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>커맨드 5</label><button class="btn" type="button" data-copy-target="commandText7">복사</button></div><textarea id="commandText7" readonly>Please move to the bottom.</textarea></div>
    </div>
  </section>

  <section class="card">
    <h2>최종본 붙여넣기</h2>
    <textarea id="finalOutput" placeholder="제미나이 최종 번역 결과를 붙여넣으세요."></textarea>
  </section>
</div>

<script src="../plan-scope-preview.js?v=20260727g"></script>
<script>
/* Prompt text/structure MUST stay identical to the proven Gemini prompt. Do not rewrite. */
(function(){
  function $(id){ return document.getElementById(id); }
  function getValue(id){
    var el = $(id);
    return el ? String(el.value || "") : "";
  }
  function setValue(id, value){
    var el = $(id);
    if(el) el.value = value;
  }

  function getPlanLimit(plan){
    if(plan === "free7" || plan === "free7_standard") return 5;
    if(plan === "asia30" || plan === "europe30" || plan === "africa30" || plan === "america30" || plan === "oceania30" || plan === "monthly30") return 30;
    if(plan === "global16") return 16;
    if(plan === "global50" || plan === "custom50" || plan === "monthly50") return 50;
    if(plan === "global70" || plan === "monthly70" || plan === "yearly70") return 70;
    if(plan === "monthly_standard" || plan === "yearly_standard" || plan === "monthly_premium" || plan === "yearly_premium") return 70;
    return 0;
  }

  function applyPlan(plan, limit){
    if(!plan) return;
    window.humateckPaymentSubscriptionPlan = plan;
    var hidden = $("humateckActivePlanValue");
    if(hidden) hidden.value = plan;
    var limitHidden = $("humateckActiveCountryLimit");
    if(limitHidden && limit) limitHidden.value = String(limit);
  }

  function getActiveCount(){
    var limitHidden = $("humateckActiveCountryLimit");
    var directLimit = limitHidden ? parseInt(limitHidden.value, 10) : 0;
    if(directLimit && directLimit > 0) return Math.min(directLimit, 70);

    var hidden = $("humateckActivePlanValue");
    var plan = hidden ? hidden.value : "";
    if(!plan && window.humateckPaymentSubscriptionPlan) plan = window.humateckPaymentSubscriptionPlan;

    if(plan === "free7" || plan === "free7_standard") return 5;
    if(plan === "asia30" || plan === "europe30" || plan === "africa30" || plan === "america30" || plan === "oceania30" || plan === "monthly30") return 30;
    if(plan === "global16") return 16;
    if(plan === "global50" || plan === "custom50" || plan === "monthly50") return 50;
    if(plan === "global70" || plan === "monthly70" || plan === "yearly70") return 70;
    if(plan === "monthly_standard" || plan === "yearly_standard" || plan === "monthly_premium" || plan === "yearly_premium") return 70;

    return 30;
  }

  function getOrderPlanId(){
    var sel = $("orderPlanSelect");
    if(sel && String(sel.value || "").trim()) return String(sel.value).trim();
    var hidden = $("humateckActivePlanValue");
    if(hidden && String(hidden.value || "").trim()) return String(hidden.value).trim();
    try{
      var stored = localStorage.getItem("humateckSelectedPlan") || "";
      if(String(stored).trim()) return String(stored).trim();
    }catch(e){}
    if(window.humateckPaymentSubscriptionPlan) return String(window.humateckPaymentSubscriptionPlan);
    return "";
  }

  function buildGeminiPrompt(){
    var activeCount = getActiveCount();
    var sourceTitle = getValue("sourceTitle");
    var sourceDescription = getValue("sourceDescription");
    var planId = getOrderPlanId();
    var planRows = null;
    if(window.HumateckPlanScope && typeof window.HumateckPlanScope.getLines === "function"){
      planRows = window.HumateckPlanScope.getLines(planId);
    }

    var countryBlock;
    if(planRows && planRows.length){
      activeCount = planRows.length;
      countryBlock = ["Country Code / Country Name Mapping Table", ""].concat(planRows).join("\n");
    }else{
      countryBlock = [
        "Country Code / Country Name Mapping Table",
        "",
        "1. en | English (US/UK/Australia, etc.)",
        "2. hi | Hindi (India)",
        "3. pt | Portuguese (Brazil)",
        "4. id | Indonesian",
        "5. es-419 | Spanish (Latin America)",
        "6. ja | Japanese",
        "7. ru | Russian",
        "8. de | German",
        "9. tr | Turkish",
        "10. ko | Korean",
        "11. fr | French",
        "12. vi | Vietnamese",
        "13. th | Thai",
        "14. fil | Filipino",
        "15. ar | Arabic (Middle East/North Africa)",
        "16. it | Italian",
        "17. ms | Malay",
        "18. zh-TW | Chinese (Taiwan)",
        "19. uk | Ukrainian",
        "20. pl | Polish",
        "21. nl | Dutch",
        "22. es | Spanish (Spain)",
        "23. sv | Swedish",
        "24. ro | Romanian",
        "25. cs | Czech",
        "26. hu | Hungarian",
        "27. el | Greek",
        "28. zh-HK | Chinese (Hong Kong)",
        "29. ur | Urdu (Pakistan)",
        "30. bn | Bengali (Bangladesh)",
        "31. pt-PT | Portuguese (Portugal)",
        "32. fa | Persian (Iran)",
        "33. iw | Hebrew (Israel)",
        "34. sw | Swahili (East Africa)",
        "35. am | Amharic (Ethiopia)",
        "36. af | Afrikaans (South Africa)",
        "37. ta | Tamil (India/Sri Lanka)",
        "38. te | Telugu (India)",
        "39. mr | Marathi (India)",
        "40. my | Burmese (Myanmar)",
        "41. km | Khmer (Cambodia)",
        "42. ne | Nepali",
        "43. lo | Lao (Laos)",
        "44. gu | Gujarati (India)",
        "45. kn | Kannada (India)",
        "46. ml | Malayalam (India)",
        "47. pa | Punjabi (India/Pakistan)",
        "48. no | Norwegian",
        "49. da | Danish",
        "50. fi | Finnish",
        "51. sk | Slovak",
        "52. bg | Bulgarian",
        "53. hr | Croatian",
        "54. sr | Serbian",
        "55. lt | Lithuanian",
        "56. lv | Latvian",
        "57. et | Estonian",
        "58. az | Azerbaijani",
        "59. ka | Georgian",
        "60. be | Belarusian",
        "61. bs | Bosnian",
        "62. mk | Macedonian",
        "63. sq | Albanian",
        "64. fr-CA | French (Canada)",
        "65. es-US | Spanish (US)",
        "66. sr-Latn | Serbian (Latin)",
        "67. ca | Catalan",
        "68. eu | Basque",
        "69. gl | Galician",
        "70. zh-CN | Chinese (Mainland China)"
      ].slice(0, activeCount + 2).join("\n");
    }

    var prompt =
`Hello Gemini!
Without any explanation, output only the translated registration text.

Translate the following YouTube title and description for the ${activeCount}-country set.
Continue from beginning to end without stopping.

[Source Text]
Title:
${sourceTitle}

Description:
${sourceDescription}

[Output Format]
Number:
Country Code:
Country Name:
Title:
Description:

Without any explanation, output only the translated registration text.

[Country Code List]
${countryBlock}

Without any explanation, output only the translated registration text.`;

    setValue("geminiPromptText", prompt);
    var gemini = $("gemini");
    if(gemini) gemini.scrollIntoView({behavior:"smooth", block:"start"});
    var status = $("geminiCopyStatus");
    if(status) status.textContent = "복사 준비됨 — 프롬프트 복사를 누르세요.";
  }

  function copyText(targetId){
    var target = $(targetId);
    if(!target) return;
    target.focus();
    target.select();
    target.setSelectionRange(0, target.value.length);
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){ done = false; }
    if(!done && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(target.value).catch(function(){});
      done = true;
    }
    var status = $("geminiCopyStatus");
    if(status && targetId === "geminiPromptText"){
      status.textContent = done ? "복사됨." : "필드를 선택한 뒤 직접 복사하세요.";
    }
  }

  document.addEventListener("click", function(e){
    var generate = e.target.closest("#generateGeminiPrompt");
    if(generate){
      e.preventDefault();
      if(!getOrderPlanId()){
        alert("먼저 배포 국가 수를 선택하세요.");
        return;
      }
      if(!String(getValue("sourceTitle") || "").trim()){
        alert("원문 제목을 입력하세요.");
        return;
      }
      buildGeminiPrompt();
      return;
    }
    var copyBtn = e.target.closest("[data-copy-target]");
    if(copyBtn){
      e.preventDefault();
      copyText(copyBtn.getAttribute("data-copy-target"));
    }
  });

  (function bindOrderPlanSelect(){
    var sel = $("orderPlanSelect");
    if(!sel) return;
    sel.addEventListener("change", function(){
      var plan = sel.value || "";
      if(!plan){
        setValue("humateckActivePlanValue", "");
        setValue("humateckActiveCountryLimit", "");
        return;
      }
      try{ localStorage.setItem("humateckSelectedPlan", plan); }catch(err){}
      applyPlan(plan, getPlanLimit(plan));
    });
  })();
})();
</script>
</body>
</html>
