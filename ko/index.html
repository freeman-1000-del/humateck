<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제미나이 AI 다국어 챗번역</title>
<meta name="description" content="국가를 선택하고 제미나이 프롬프트를 생성·복사한 뒤, 결과를 붙여넣으세요.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:"Noto Sans KR",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit}
.wrap{width:900px;max-width:calc(100vw - 32px);margin:0 auto;padding:24px 0 80px}
.card{
  border:1px solid rgba(214,176,78,.72);border-radius:24px;
  background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));
  padding:28px 30px;margin-bottom:20px;box-shadow:0 18px 46px rgba(0,0,0,.28);
}
.card h1{color:#7ec8ff;margin:0 0 22px;font-size:44px;line-height:1.25;text-align:center;font-weight:900}
.card h2{color:#f4c95c;margin:0 0 14px;font-size:20px}
label{display:block;margin:10px 0 6px;color:#ffd95a;font-weight:800}
.planRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,240px);gap:14px 18px;align-items:start;margin-bottom:12px}
.planRow label{grid-column:1 / -1;margin-bottom:0}
.planPickerControls{min-width:0}
.planPickerControls select{margin-bottom:0}
.planTip{margin:0;padding-top:2px;color:#ffd95a;font-size:13px;line-height:1.55;font-weight:700}
.nativeCodeLabelRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 6px}
.nativeCodeLabelRow label{margin:0}
.nativeCodeListBtn{
  display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px;
  border:1px solid #d9b256;border-radius:10px;background:#121722;color:#ffd95a;font-size:13px;font-weight:800;cursor:pointer;
}
.nativeCodeModal{
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.72);
}
.nativeCodeModal.open{display:flex}
.nativeCodeModalBox{
  width:720px;max-width:100%;max-height:min(80vh,720px);overflow:auto;
  border:1px solid rgba(214,176,78,.72);border-radius:18px;background:#121a23;padding:18px 18px 22px;
}
.nativeCodeModalHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.nativeCodeModalHeader h2{margin:0;color:#ffd95a;font-size:18px}
.nativeCodeCloseBtn{
  min-width:72px;min-height:40px;border:1px solid #4b5d6d;border-radius:10px;background:#050b14;color:#f4f1e8;font-weight:800;cursor:pointer;
}
.nativeCodeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nativeCodeItem{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border:1px solid #4b5d6d;border-radius:10px;background:#050b14;
}
.nativeCodeText{color:#eef1f6;font-size:13px;line-height:1.4}
.nativeCodeText strong{color:#ffd95a}
.nativeCodeItem button{
  flex:0 0 auto;min-width:64px;min-height:34px;border:1px solid #d9b256;border-radius:8px;
  background:#1a1408;color:#ffd95a;font-size:12px;font-weight:800;cursor:pointer;
}
@media(max-width:720px){
  .card h1{font-size:32px}
  .planRow{grid-template-columns:1fr}
  .nativeCodeGrid{grid-template-columns:1fr}
}
input,textarea,select{
  width:100%;padding:14px;background:#050b14;color:#f7f1e6;
  border:1px solid #4b5d6d;border-radius:12px;font-size:15px;margin:0 0 12px;
}
textarea{min-height:160px;line-height:1.72;resize:vertical}
#geminiPromptText,#finalOutput{min-height:220px}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-width:200px;min-height:52px;
  padding:12px 20px;border:2px solid #d9b256;border-radius:14px;color:#fff;font-size:17px;font-weight:900;
  background:linear-gradient(180deg,#5c4315,#15110a);cursor:pointer;
}
.btn.secondary{background:#121722;border-color:#4b5d6d}
.copyStatus{min-height:22px;color:#8dffb0;font-weight:800;text-align:center;margin:8px 0 0}
.commandFullItem{margin-bottom:12px}
.commandFullTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.commandFullTop label{margin:0}
.commandFullTop .btn{min-width:90px;min-height:40px;font-size:14px;padding:8px 12px}
.commandFullItem textarea{min-height:72px;margin-bottom:0}
.planPickerControls select{margin-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>제미나이 AI 다국어 챗번역</h1>
    <div class="planRow">
      <label for="orderPlanSelect">번역국가 선택 (최대 70개국)</label>
      <div class="planPickerControls" id="planPickerSection">
        <select id="orderPlanSelect" aria-label="번역국가 선택 (최대 70개국)">
          <option value="">번역 국가 수를 선택하세요…</option>
          <option value="asia30">아시아 (30개국)</option>
          <option value="europe30">유럽 (30개국)</option>
          <option value="africa30">아프리카 (30개국)</option>
          <option value="america30">아메리카 (30개국)</option>
          <option value="oceania30">오세아니아 (30개국)</option>
          <option value="global16">전세계 16개국</option>
          <option value="global50">전세계 50개국</option>
          <option value="global70">전세계 70개국</option>
        </select>
      </div>
      <p class="planTip">번역 글자수는 가급적 5천자 이내를 사용하시는 것이 좋습니다. 그 이상은 대량 동시 처리에 부담이 될 수 있습니다.</p>
    </div>
    <input type="hidden" id="humateckActivePlanValue" value="">
    <input type="hidden" id="humateckActiveCountryLimit" value="">

    <div class="nativeCodeLabelRow">
      <label for="nativeLanguageCode">자국어 코드</label>
      <button id="openNativeCodeListBtn" class="nativeCodeListBtn" type="button">70개 국가명/언어코드 목록</button>
    </div>
    <input id="nativeLanguageCode" type="text" placeholder="예: ko, ja, de, fr, es" autocomplete="off" spellcheck="false">

    <label for="sourceTitle">원문 제목</label>
    <input id="sourceTitle" type="text" placeholder="원문 제목을 입력하세요" autocomplete="off" spellcheck="false">

    <label for="sourceDescription">원문 설명</label>
    <textarea id="sourceDescription" placeholder="원문 설명을 입력하세요" autocomplete="off" spellcheck="false"></textarea>

    <div class="actions">
      <button class="btn" type="button" id="generateGeminiPrompt">제미나이 명령문 생성</button>
    </div>
  </section>

  <section id="gemini" class="card">
    <h2>제미나이 명령문 복사</h2>
    <textarea id="geminiPromptText" readonly>Hello Gemini!
아무런 설명없이 오직 번역문만 출력해 줘.

아래 제목과 설명문을 {activeCount}개 국가 세트에 맞춰 번역해 줘.
처음부터 끝까지 중간에 끊지 말고 계속 번역해 줘.

[원문]
Title:
{sourceTitle}

Description:
{sourceDescription}

[출력 형식]
Number:
Country Code:
Country Name:
Title:
Description:

아무런 설명없이 오직 번역문만 출력해 줘.

[Country Code List]
{countryBlock}

아무런 설명없이 오직 번역문만 출력해 줘.</textarea>
    <div class="actions">
      <button class="btn" type="button" data-copy-target="geminiPromptText">제미나이 명령문 복사</button>
    </div>
    <p id="geminiCopyStatus" class="copyStatus"></p>
  </section>

  <section class="card" id="geminiCommandCard">
    <h2>제미나이 복붙 명령 순서</h2>
    <div class="commandFullRows">
      <div class="commandFullItem"><div class="commandFullTop"><label>명령 1</label><button class="btn" type="button" data-copy-target="commandText1">복사</button></div><textarea id="commandText1" readonly>다른 언어의 혼입, 부자연스러운 문맥, 기타 문제가 없는지 자동으로 신중하게 확인해 줘.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>명령 2</label><button class="btn" type="button" data-copy-target="commandText2">복사</button></div><textarea id="commandText2" readonly>Number: , Country Name:를 삭제해 줘.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>명령 3</label><button class="btn" type="button" data-copy-target="commandText4">복사</button></div><textarea id="commandText4" readonly>다른 언어, 부자연스러운 문맥, 기타 문제가 없는지 다시 한 번 주의 깊게 확인해 줘.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>명령 4</label><button class="btn" type="button" data-copy-target="commandText5">복사</button></div><textarea id="commandText5" readonly>제미나이의 설명문이나 해설 등을 모두 빼고 다시 출력해 줘.</textarea></div>
      <div class="commandFullItem"><div class="commandFullTop"><label>명령 5</label><button class="btn" type="button" data-copy-target="commandText7">복사</button></div><textarea id="commandText7" readonly>아래로 이동해 줘</textarea></div>
    </div>
  </section>

  <section class="card">
    <h2>최종 번역 결과</h2>
    <textarea id="finalOutput" placeholder="제미나이 최종 번역 결과를 붙여넣어 주세요."></textarea>
  </section>
</div>

<div id="nativeCodeModal" class="nativeCodeModal" aria-hidden="true">
  <div class="nativeCodeModalBox">

      <button id="closeNativeCodeListBtn" class="nativeCodeCloseBtn" type="button">닫기</button>
    </div>
    <div id="nativeCodeGrid" class="nativeCodeGrid"></div>
  </div>
</div>

    oceania30: [
      "1. en | 영어(호주/뉴질랜드/태평양)","2. fil | 필리핀어(태평양 필리핀계)",
      "3. hi | 힌디어(인도)","4. id | 인도네시아어","5. ja | 일본어","6. ko | 한국어",
      "7. vi | 베트남어","8. th | 태국어","9. ms | 말레이어","10. zh-TW | 중국어(대만)",
      "11. zh-HK | 중국어(홍콩)","12. ur | 우르두어(파키스탄)","13. bn | 벵골어(방글라데시)",
      "14. fa | 페르시아어(이란)","15. iw | 히브리어(이스라엘)","16. ar | 아랍어",
      "17. ru | 러시아어","18. de | 독일어","19. tr | 튀르키예어","20. fr | 프랑스어",
      "21. it | 이탈리아어","22. es | 스페인어","23. nl | 네덜란드어","24. pl | 폴란드어",
      "25. uk | 우크라이나어","26. sv | 스웨덴어","27. ro | 루마니아어","28. cs | 체코어",
      "29. hu | 헝가리어","30. el | 그리스어"
    ]
  };

  function getPlanLimit(plan){
    if(plan === "free7" || plan === "free7_standard") return 5;
    if(plan === "asia30" || plan === "europe30" || plan === "africa30" || plan === "america30" || plan === "oceania30" || plan === "monthly30") return 30;
    if(plan === "global16") return 16;
    if(plan === "global50" || plan === "custom50" || plan === "monthly50") return 50;
    if(plan === "global70" || plan === "monthly70" || plan === "yearly70") return 70;
    if(plan === "monthly_standard" || plan === "yearly_standard" || plan === "monthly_premium" || plan === "yearly_premium") return 70;
    return 0;
  }

  function applyPlan(plan, limit){
    if(!plan) return;
    window.humateckPaymentSubscriptionPlan = plan;
    var hidden = $("humateckActivePlanValue");
    if(hidden) hidden.value = plan;
    var limitHidden = $("humateckActiveCountryLimit");
    if(limitHidden && limit) limitHidden.value = String(limit);
  }

  function getActiveCount(){
    var limitHidden = $("humateckActiveCountryLimit");
    var directLimit = limitHidden ? parseInt(limitHidden.value, 10) : 0;
    if(directLimit && directLimit > 0) return Math.min(directLimit, 70);

    var hidden = $("humateckActivePlanValue");
    var plan = hidden ? hidden.value : "";
    if(!plan && window.humateckPaymentSubscriptionPlan) plan = window.humateckPaymentSubscriptionPlan;

    var limit = getPlanLimit(plan);
    return limit > 0 ? limit : 30;
  }

  function getOrderPlanId(){
    var sel = $("orderPlanSelect");
    if(sel && String(sel.value || "").trim()) return String(sel.value).trim();
    var hidden = $("humateckActivePlanValue");
    if(hidden && String(hidden.value || "").trim()) return String(hidden.value).trim();
    try{
      var stored = localStorage.getItem("humateckSelectedPlan") || "";
      if(String(stored).trim()) return String(stored).trim();
    }catch(e){}
    if(window.humateckPaymentSubscriptionPlan) return String(window.humateckPaymentSubscriptionPlan);
    return "";
  }

  function buildGeminiPrompt(){
    var activeCount = getActiveCount();
    var sourceTitle = getValue("sourceTitle");
    var sourceDescription = getValue("sourceDescription");
    var activePlan = getOrderPlanId();
    var planList = PLAN_COUNTRY_LISTS[activePlan] || PLAN_COUNTRY_LISTS.global70;
    if(planList && planList.length){
      activeCount = planList.length;
    }
    var countryBlock = ["Country Code / 국가명 매핑표", ""].concat(planList).join("\n");

    var prompt =
`Hello Gemini!
아무런 설명없이 오직 번역문만 출력해 줘.

아래 제목과 설명문을 ${activeCount}개 국가 세트에 맞춰 번역해 줘.
처음부터 끝까지 중간에 끊지 말고 계속 번역해 줘.

[원문]
Title:
${sourceTitle}

Description:
${sourceDescription}

[출력 형식]
Number:
Country Code:
Country Name:
Title:
Description:

아무런 설명없이 오직 번역문만 출력해 줘.

[Country Code List]
${countryBlock}

아무런 설명없이 오직 번역문만 출력해 줘.`;

    setValue("geminiPromptText", prompt);
    var gemini = $("gemini");
    if(gemini) gemini.scrollIntoView({behavior:"smooth", block:"start"});
    var status = $("geminiCopyStatus");
    if(status) status.textContent = "제미나이 의뢰문이 생성되었습니다. 복사 버튼을 눌러 주세요.";
  }

  function copyText(targetId){
    var target = $(targetId);
    if(!target) return;
    target.focus();
    target.select();
    target.setSelectionRange(0, target.value.length);
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){ done = false; }
    if(!done && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(target.value).catch(function(){});
      done = true;
    }
    var status = $("geminiCopyStatus");
    if(status && targetId === "geminiPromptText"){
      status.textContent = done ? "복사됨." : "필드를 선택한 뒤 직접 복사하세요.";
    }
  }

  document.addEventListener("click", function(e){
    var generate = e.target.closest("#generateGeminiPrompt");
    if(generate){
      e.preventDefault();
      if(!getOrderPlanId()){
        alert("먼저 번역 국가 수를 선택하세요.");
        return;
      }
      if(!String(getValue("sourceTitle") || "").trim()){
        alert("원문 제목을 입력하세요.");
        return;
      }
      buildGeminiPrompt();
      return;
    }
    var copyBtn = e.target.closest("[data-copy-target]");
    if(copyBtn){
      e.preventDefault();
      copyText(copyBtn.getAttribute("data-copy-target"));
    }
  });

  (function bindOrderPlanSelect(){
    var sel = $("orderPlanSelect");
    if(!sel) return;
    sel.addEventListener("change", function(){
      var plan = sel.value || "";
      if(!plan){
        setValue("humateckActivePlanValue", "");
        setValue("humateckActiveCountryLimit", "");
        return;
      }
      try{ localStorage.setItem("humateckSelectedPlan", plan); }catch(err){}
      applyPlan(plan, getPlanLimit(plan));
    });
  })();
})();
</script>
</body>
</html>
