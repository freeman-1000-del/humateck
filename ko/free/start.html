<title>7일 무료플랜 시작 | Humateck</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{width:960px;max-width:calc(100vw - 40px);margin:44px auto;padding-bottom:60px}
.logo{width:190px;height:auto;display:block;margin-bottom:22px}
.card{border:1px solid rgba(214,176,78,.72);border-radius:24px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:30px 34px;margin-bottom:22px;box-shadow:0 18px 46px rgba(0,0,0,.28)}
h1,h2{color:#ffd95a;margin-top:0}
p{font-size:17px;line-height:1.72;color:#eee5d5}
input{width:100%;padding:15px;background:#eef4ff;color:#111;border:1px solid #9fb4d6;border-radius:12px;font-size:18px;margin:8px 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:230px;min-height:54px;padding:13px 22px;border:2px solid #d9b256;border-radius:14px;color:#fff;font-size:19px;font-weight:900;background:linear-gradient(180deg,#5c4315,#15110a);cursor:pointer}
.btn.secondary{background:rgba(214,176,78,.10)}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.notice{border:1px solid rgba(255,217,90,.55);border-radius:16px;background:rgba(255,217,90,.08);padding:16px 18px;margin-top:16px}
.deadline{color:#ffd95a;font-weight:900}
.planMirror{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.planLink{border:1px solid rgba(214,176,78,.55);border-radius:16px;background:rgba(5,11,20,.42);padding:16px}
.planLink strong{color:#ffd95a}
.devNote{font-size:13px;color:#cfc8b9;border-top:1px solid rgba(255,255,255,.12);margin-top:22px;padding-top:12px}
@media(max-width:760px){.planMirror{grid-template-columns:1fr}.wrap{max-width:calc(100vw - 24px)}}
</style>

<body>
<div class="wrap">
  <a href="../index.html"><img class="logo" src="../FINAL_LOGO01.png" alt="Humateck"></a>

  <section class="card">
    <h1>7일 무료플랜 시작</h1>
    <p><strong>15개국 유튜브 다국어 등록 무료체험.</strong></p>
    <p>이메일을 입력하고 한글판 7일 무료플랜을 시작해 주세요.</p>

    <label for="freeEmail"><strong>이메일</strong></label>
    <input id="freeEmail" type="email" name="email" autocomplete="email" placeholder="your@email.com">

    <div class="actions">
      <button id="startFreeTrialBtn" class="btn" type="button">7일 무료플랜 시작</button>
      <a class="btn secondary" href="../plans.html">유료 플랜 보기</a>
    </div>

    <div id="freeTrialNotice" class="notice" style="display:none;"></div>
  </section>

  
</div>


<script>
(function(){

function pad(n){ return String(n).padStart(2, "0"); }

function formatKst(dateString){
  var d = new Date(dateString);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+" KST";
}

async function loadOrCreateFreePlan(email){

  const existing = await humateckSupabase
    .from("free_trial_members")
    .select("*")
    .eq("email", email)
    .maybeSingle();

  if(existing.data){
    localStorage.setItem("humateckFreeOnlyEmail", email);
    return {
      fresh:false,
      end:existing.data.trial_end
    };
  }

  const now = new Date();
  const end = new Date(now.getTime() + (7 * 24 * 60 * 60 * 1000));

  const inserted = await humateckSupabase
    .from("free_trial_members")
    .insert([{
      email: email,
      plan_type: "free7",
      country_limit: 15,
      status: "active",
      trial_start: now.toISOString(),
      trial_end: end.toISOString()
    }])
    .select()
    .single();

  return {
    fresh:true,
    end:inserted.data.trial_end
  };
}

var btn = document.getElementById("startFreeTrialBtn");
var input = document.getElementById("freeEmail");
var notice = document.getElementById("freeTrialNotice");

btn.addEventListener("click", async function(){

  var email = (input.value || "").trim().toLowerCase();

  if(!email || email.indexOf("@") < 1){
    notice.style.display = "block";
    notice.innerHTML = "이메일을 입력해 주세요.";
    return;
  }

  btn.disabled = true;
  btn.innerText = "처리 중...";

  try{

    var t = await loadOrCreateFreePlan(email);

    notice.style.display = "block";
    notice.innerHTML =
      (t.fresh ? "7일 무료플랜이 활성화되었습니다." : "기존 7일 무료플랜 정보를 불러왔습니다.") +
      "<br>무료플랜 종료 시각: <span class='deadline'>" + formatKst(t.end) + "</span>" +
      "<br><br><a class='btn' href='order.html'>무료 주문페이지로 이동</a>";

  }catch(e){

    notice.style.display = "block";
    notice.innerHTML = "무료플랜 서버에 연결할 수 없습니다.";

  }

  btn.disabled = false;
  btn.innerText = "7일 무료플랜 시작";

});

})();
</script>

</body>
