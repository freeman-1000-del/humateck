<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 및 등록 - Humateck</title>
    <style>
        body { font-family: sans-serif; padding: 40px; line-height: 1.8; }
        .box { border: 1px solid #4b97ff; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .notice-box { background: #f9f9f9; border-left: 5px solid #ffd95a; padding: 15px; margin: 20px 0; }
        .btn-auth { background: #4b97ff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <p><strong>유튜브 등록할 때마다 필히 Google OAuth 인증을 받아야 합니다.</strong></p>
        <button class="btn-auth">Google OAuth 인증하기</button>
    </div>

    <div class="notice-box">
        당사는 고객님의 번역 승인본에 대해 어떠한 검수나 차단 · 변경 · 추가를 하지 않으며, 고객 승인 내용 그대로 발송합니다. 
        모든 번역문은 유튜브 채널에 즉시 등록되며, 접수측이 실제로 거부한 언어는 보류 언어로 분리 표시됩니다.
    </div>

    <div class="order-form">
        <h3>유튜브 영상 주소 입력</h3>
        <input type="text" placeholder="https://www.youtube.com/watch?v=..." style="width: 80%; padding: 10px;">
    </div>

    </body>
</html>
