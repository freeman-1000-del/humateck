<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문하기 - Humateck</title>
    <style>
        body { background:#050b14; color:#f4f1e8; font-family:sans-serif; padding:20px; }
        .card { border:1px solid #4b97ff; border-radius:15px; padding:25px; background:#141c25; margin-bottom:20px; }
        .notice { background:rgba(255, 217, 90, 0.1); border-left:4px solid #ffd95a; padding:20px; margin:20px 0; line-height:1.6; }
        .btn-auth { background:#4b97ff; color:#fff; border:none; padding:12px 25px; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>
    <div class="card">
        <p><strong>유튜브 등록할 때마다 필히 Google OAuth 인증을 받아야 합니다.</strong></p>
        <button class="btn-auth">Google OAuth 인증하기</button>
    </div>

    <div class="notice">
        당사는 고객님의 번역 승인본에 대해 어떠한 검수나 차단 · 변경 · 추가를 하지 않으며, 고객 승인 내용 그대로 발송합니다. 
        모든 번역문은 유튜브 채널에 즉시 등록되며, 접수측이 실제로 거부한 언어는 보류 언어로 분리 표시됩니다.
    </div>

    </body>
</html>
