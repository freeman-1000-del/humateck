<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국가 범위 안내 | 유튜브 다국어채널 등록기 구매자용 구글 인증 연습기</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}
a{color:#6ca6ff;text-decoration:none}
.wrap{width:1180px;max-width:calc(100vw - 48px);margin:0 auto;padding:24px 0 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.logo{width:210px;height:auto;display:block}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.miniNavButton{display:inline-flex;align-items:center;padding:10px 16px;border:1px solid rgba(214,176,78,.68);border-radius:999px;color:#f4d16d;background:rgba(214,176,78,.12);font-weight:800}
.card{border:1px solid rgba(214,176,78,.72);border-radius:24px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:28px 32px;margin-bottom:24px}
.card h1{color:#ffd95a;font-size:30px;margin:0 0 12px}
.card p{color:#e6e0d4;line-height:1.72;font-size:17px;margin:8px 0}
.scopeTitle{color:#ffd95a;font-size:20px;font-weight:800;margin:0 0 12px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.plan{border:1px solid rgba(214,176,78,.72);border-radius:20px;background:rgba(16,23,31,.94);padding:22px;display:flex;flex-direction:column;min-height:140px}
.plan h3{margin:0 0 8px;color:#ffd95a;font-size:20px}
.plan p{color:#e6e0d4;font-size:15px;line-height:1.6;flex:1;margin:0}
.plan.featured{border-color:#ffd95a}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:2px solid #d9b256;border-radius:12px;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(180deg,#5c4315,#15110a);text-decoration:none}
.note{border:1px solid rgba(159,212,255,.45);border-radius:16px;padding:18px;background:rgba(159,212,255,.08);color:#cfe8ff;font-size:15px;line-height:1.7}
.siteFooter{display:flex;justify-content:center;gap:20px;margin-top:28px;color:#cfc8b9;font-size:15px;flex-wrap:wrap}
.siteFooter a{color:#6ca6ff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="/deployer.html"><img class="logo" src="/FINAL_LOGO01.png" alt="Humateck"></a>
    <nav class="nav">
      <a class="miniNavButton" href="/deployer.html">연습기 열기</a>
    </nav>
  </header>

  <section class="card">
    <h1>국가·대륙 범위 안내</h1>
    <p>이 페이지는 <strong>유튜브 다국어채널 등록기 구매자용 구글 인증 연습기</strong>(웹)에서 쓰는 국가 묶음을 설명합니다.</p>
    <div class="note" style="margin-top:16px">
      <strong>웹사이트는 유료 판매·구독을 하지 않습니다.</strong><br>
      웹 = 등록 직전 체험 · 번역 안내 · Google OAuth 연습.<br>
      실제 YouTube 등록은 <strong>PC 영구판 프로그램</strong>(별도 구매)으로만 가능합니다.
    </div>
    <p style="margin-top:16px"><a class="btn" href="/deployer.html">연습기로 이동</a></p>
  </section>

  <section class="card">
    <h2 class="scopeTitle">선택 가능한 범위</h2>
    <p>연습기 상단 드롭다운에서 아래와 동일하게 선택합니다. 가격·요금제는 없습니다.</p>
    <div class="plans" id="planGrid"></div>
  </section>

  <footer class="siteFooter">
    <a href="/deployer.html">연습기</a><span>|</span>
    <a href="/terms.html">이용약관</a><span>|</span>
    <a href="/privacy.html">개인정보처리방침</a>
  </footer>
</div>

<script>
(function(){
  var SCOPES = [
    { id:"asia30", name:"아시아 플랜 (30개국)", desc:"한국·일본·중국·인도·베트남·태국·인도네시아 등 아시아 30개국" },
    { id:"europe30", name:"유럽 플랜 (30개국)", desc:"영국·프랑스·독일·이탈리아·스페인·네덜란드·폴란드 등 유럽 30개국" },
    { id:"africa30", name:"아프리카 플랜 (30개국)", desc:"이집트·남아공·케냐·나이지리아·가나·모로코 등 아프리카 30개국" },
    { id:"america30", name:"아메리카 플랜 (30개국)", desc:"미국·캐나다·멕시코·브라질·아르헨티나 등 아메리카 30개국" },
    { id:"oceania30", name:"오세아니아 플랜 (30개국)", desc:"호주·뉴질랜드·피지 등 오세아니아 및 보조 글로벌 국가" },
    { id:"global50", name:"Global 50 (5대륙 핵심 50개국)", desc:"전 세계 주요 50개국 한 번에" },
    { id:"global70", name:"Global 70 (70개국 전체)", desc:"주요 70개국 전체 커버", featured:true },
    { id:"custom50", name:"임의 선택 (최대 50개국)", desc:"70개국 목록에서 직접 최대 50개국 선택" }
  ];
  var grid = document.getElementById("planGrid");
  SCOPES.forEach(function(s){
    var art = document.createElement("article");
    art.className = "plan" + (s.featured ? " featured" : "");
    art.innerHTML = "<h3>" + s.name + "</h3><p>" + s.desc + "</p>";
    grid.appendChild(art);
  });
})();
</script>
</body>
</html>
