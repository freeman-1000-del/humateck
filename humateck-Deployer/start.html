<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Your 7-Day Free Trial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:860px;max-width:calc(100vw - 36px);margin:0 auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.logo{width:190px}.card{border:1px solid rgba(214,176,78,.72);border-radius:24px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:34px;box-shadow:0 18px 46px rgba(0,0,0,.28)}h1{color:#ffd95a;font-size:36px;margin:0 0 10px}.lead{font-size:19px;line-height:1.7;margin:0 0 24px}.label{display:block;color:#ffd95a;font-weight:900;margin:18px 0 8px}input{width:100%;padding:16px;border:1px solid #4b5d6d;border-radius:14px;font-size:18px;background:#edf4ff;color:#050b14}button,.btn{display:inline-flex;align-items:center;justify-content:center;min-width:230px;min-height:56px;margin:22px 12px 0 0;padding:12px 22px;border:2px solid #d9b256;border-radius:14px;color:#fff;background:linear-gradient(180deg,#5c4315,#15110a);font-size:19px;font-weight:900;cursor:pointer}.muted{font-size:15px;color:#d8d0bd;line-height:1.6;margin-top:10px}.done{display:none;border:1px solid rgba(255,217,90,.62);border-radius:16px;background:rgba(255,217,90,.08);padding:18px;margin-top:22px;font-size:17px;line-height:1.7}.highlight{color:#ffd95a;font-weight:900}.smallTop{margin-bottom:18px}.miniNav{display:inline-flex;border:1px solid rgba(214,176,78,.55);border-radius:999px;padding:8px 14px;color:#e8d8a8;background:rgba(255,255,255,.03);font-weight:800}
</style>
<!-- Humateck_New208: free folder only. Uses free-only storage keys and never writes root order.html membership keys. -->
</head>
<body>
<div class="wrap">
  <header class="top"><a href="../index.html"><img class="logo" src="../FINAL_LOGO01.png" alt="Humateck"></a><a class="miniNav" href="../plans.html">Back to Plans</a></header>
  <section class="card">
    <h1>Start Your 7-Day Free Trial</h1>
    <p class="lead"><strong>5-country subtitle registration.</strong><br>Start simply with your email and continue to the free trial order page.</p>
    <label class="label" for="trialEmail">Email</label>
    <input id="trialEmail" type="email" name="email" autocomplete="email" placeholder="your@email.com">
    <p class="muted">Use the browser email suggestion shown from your own device.</p>
    <button id="startTrialBtn" type="button">Start Free Plan</button>
    <a class="btn" href="../plans.html">Back to Plans</a>
    <div id="trialDone" class="done"></div>
  </section>
</div>
<script>
(function(){
  function pad(n){return String(n).padStart(2,"0")}
  function kst(ms){var d=new Date(ms+(9*60*60*1000));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())+" "+pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())+":"+pad(d.getUTCSeconds())+" KST"}
    var params=new URLSearchParams(window.location.search||"");
    var plan=params.get("plan")||"free7_standard";
    if(plan!=="free7_enterprise" && plan!=="free7_standard" && plan!=="free7") plan="free7_standard";
    if(plan==="free7") plan="free7_standard";
    var btn=document.getElementById('startTrialBtn');
  btn.addEventListener('click',function(){
    var email=(document.getElementById('trialEmail').value||'').trim();
    if(!email){alert('Please enter your email.');return;}
    var startMs=Date.now();
    var endMs=startMs+(7*24*60*60*1000);
    try{
      localStorage.setItem('humateckFreeTrialEmail',email);
      localStorage.setItem('humateckFreeOnlyTrialActive','true');
      localStorage.setItem('humateckFreeOnlyTrialStartMs',String(startMs));
      localStorage.setItem('humateckFreeOnlyTrialEndMs',String(endMs));
      localStorage.setItem('humateckFreeOnlyActivePlan',plan);
      localStorage.setItem('humateckFreeOnlySubscriberPlan',plan);
      localStorage.setItem('humateckSelectedPlan',plan);
    }catch(e){}
    var box=document.getElementById('trialDone');
    box.style.display='block';
    box.innerHTML='Free trial activated.<br>Trial ends at: <span class="highlight">'+kst(endMs)+'</span><br><a class="btn" href="order.html?plan='+encodeURIComponent(plan)+'">Continue to Free Trial Order Page</a>';
  });
})();
</script>
</body>
</html>
