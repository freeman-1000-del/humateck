<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review demo embed</title>
  <style>
    body{margin:0;background:#050b14;color:#e6e0d4;font-family:Arial,"Segoe UI",sans-serif}
    #reviewLoadMsg{padding:32px 24px;text-align:center;line-height:1.7;font-size:15px;color:#c8c4b8}
    #reviewLoadMsg strong{color:#ffd95a}
  </style>
</head>
<body>
  <p id="reviewLoadMsg"><strong>Loading registration tool…</strong><br>Please wait 30–60 seconds (internet required).</p>
  <script>
(function () {
  var REVIEW_KEY = "humateckReviewDemoEnOk";
  var REVIEW_UNTIL = new Date("2026-08-12T23:59:59+09:00").getTime();
  var GATE_URL = "/humateck-Deployer/review-demo/";

  function showError(msg) {
    document.body.innerHTML =
      '<p style="color:#e6e0d4;font-family:Arial,sans-serif;padding:24px;text-align:center">' +
      msg +
      ' <a href="mailto:support@humateck.com" style="color:#6ca6ff">support@humateck.com</a></p>';
  }

  try {
    if (Date.now() > REVIEW_UNTIL || sessionStorage.getItem(REVIEW_KEY) !== "1") {
      location.replace(GATE_URL);
      return;
    }
  } catch (e) {
    location.replace(GATE_URL);
    return;
  }

  window.__HUMATECK_OPEN_PRACTICE__ = true;
  window.__HUMATECK_PURE_PRODUCT__ = true;
  var STORAGE_BASE = "https://ajvtyotblrtexcxuazqm.supabase.co/storage/v1/object/public/humateck-site";

  function loadScript(src, next) {
    var s = document.createElement("script");
    s.src = src + "?v=" + Date.now();
    s.onload = function () { if (next) next(); };
    s.onerror = function () { if (next) next(); };
    document.body.appendChild(s);
  }

  function patchDemoHtml(html) {
    html = html.replace(/<script[^>]*pricing-config[^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script[^>]*pricing-apply[^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script>\s*\/\* Custom 50-country picker[\s\S]*?<\/script>/i, "");
    return html;
  }

  function attachDemoAssets() {
    fetch("demo5-modal.html?v=" + Date.now(), { cache: "no-store" })
      .then(function (res) { return res.ok ? res.text() : ""; })
      .then(function (modalHtml) {
        if (modalHtml && !document.getElementById("demo5Modal")) {
          document.body.insertAdjacentHTML("beforeend", modalHtml);
        }
        var old50 = document.getElementById("custom50Modal");
        if (old50) old50.style.display = "none";
        loadScript("product-pure-sanitize.js", function () {
          loadScript("demo5-picker.js");
        });
      });
  }

  fetch(STORAGE_BASE + "/deployer-en/index.html?v=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.text();
    })
    .then(function (html) {
      var msg = document.getElementById("reviewLoadMsg");
      if (msg) msg.parentNode.removeChild(msg);
      document.open();
      document.write(patchDemoHtml(html));
      document.close();
      document.body.classList.add("humateck-open-practice", "humateck-pure-product");
      attachDemoAssets();
    })
    .catch(function () {
      showError("Could not load the review demo.");
    });
})();
  </script>
</body>
</html>
