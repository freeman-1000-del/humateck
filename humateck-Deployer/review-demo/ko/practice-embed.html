<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humateck Deployer embed</title>
  <style>body{margin:0;background:#050b14}</style>
</head>
<body>
  <script>
(function () {
  var STORAGE_BASE = "https://ajvtyotblrtexcxuazqm.supabase.co/storage/v1/object/public/humateck-site";

  function patchReviewHtml(html) {
    html = html.replace(
      /<button class="btn" type="button" id="sendOrderBtn" disabled aria-disabled="true" data-web-register-disabled="1"[^>]*>등록 불가 \(PC 프로그램 필요\)<\/button>/,
      '<button class="btn" type="button" id="sendOrderBtn">유튜브 다국어 등록</button>'
    );
    html = html.replace(
      /<h2>등록 결과 \(PC판 전용기능이므로 구현 불가\)<\/h2>/,
      "<h2>등록 결과</h2>"
    );
    html = html.replace(
      /<script src="deployer-auth\.js"><\/script>/,
      '<script src="' + STORAGE_BASE + '/deployer/deployer-auth.js"><\/script>'
    );
    html = html.replace(
      /<script src="youtube-register\.js"><\/script>/,
      '<script src="' + STORAGE_BASE + '/deployer/youtube-register.js"><\/script>'
    );
    return html;
  }

  fetch(STORAGE_BASE + "/deployer/index.html?v=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.text();
    })
    .then(function (html) {
      document.open();
      document.write(patchReviewHtml(html));
      document.close();
    })
    .catch(function () {
      document.body.innerHTML =
        '<p style="color:#e6e0d4;font-family:Arial,sans-serif;padding:24px;text-align:center">등록기를 불러오지 못했습니다. ' +
        '<a href="mailto:support@humateck.com" style="color:#6ca6ff">support@humateck.com</a></p>';
    });
})();
  </script>
</body>
</html>
