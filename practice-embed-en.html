<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice</title>
  <style>body{margin:0;background:#050b14}</style>
</head>
<body>
  <script>
(function () {
  window.__HUMATECK_OPEN_PRACTICE__ = true;
  window.__HUMATECK_PURE_PRODUCT__ = true;
  var STORAGE_BASE = "https://ajvtyotblrtexcxuazqm.supabase.co/storage/v1/object/public/humateck-site";

  function loadScript(src, next) {
    var s = document.createElement("script");
    s.src = src + "?v=" + Date.now();
    s.onload = function () { if (next) next(); };
    s.onerror = function () { if (next) next(); };
    document.body.appendChild(s);
  }

  function patchDemoHtml(html) {
    html = html.replace(/<script[^>]*pricing-config[^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script[^>]*pricing-apply[^>]*>\s*<\/script>/gi, "");
    html = html.replace(/<script>\s*\/\* Custom 50-country picker[\s\S]*?<\/script>/i, "");
    return html;
  }

  function attachDemoAssets() {
    fetch("/demo5-modal-en.html?v=" + Date.now(), { cache: "no-store" })
      .then(function (res) { return res.ok ? res.text() : ""; })
      .then(function (modalHtml) {
        if (modalHtml && !document.getElementById("demo5Modal")) {
          document.body.insertAdjacentHTML("beforeend", modalHtml);
        }
        var old50 = document.getElementById("custom50Modal");
        if (old50) old50.style.display = "none";
        loadScript("/product-pure-sanitize-en.js", function () {
          loadScript("/demo5-picker-en.js");
        });
      });
  }

  fetch(STORAGE_BASE + "/deployer-en/index.html?v=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.text();
    })
    .then(function (html) {
      document.open();
      document.write(patchDemoHtml(html));
      document.close();
      document.body.classList.add("humateck-open-practice", "humateck-pure-product");
      attachDemoAssets();
    })
    .catch(function () {
      document.body.innerHTML =
        '<p style="color:#e6e0d4;font-family:Arial,sans-serif;padding:24px;text-align:center">Could not load the practice tool. ' +
        '<a href="mailto:support@humateck.com" style="color:#6ca6ff">support@humateck.com</a></p>';
    });
})();
  </script>
</body>
</html>
