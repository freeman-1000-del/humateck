<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice</title>
  <style>body{margin:0;background:#050b14}</style>
</head>
<body>
  <script>
(function () {
  window.__HUMATECK_OPEN_PRACTICE__ = true;
  var STORAGE_BASE = "https://ajvtyotblrtexcxuazqm.supabase.co/storage/v1/object/public/humateck-site";

  function bootHumateckAnalytics() {
    if (window.__HUMATECK_GA_READY__) return;
    var s = document.createElement("script");
    s.src = "https://humateck.com/analytics-humateck.js?v=" + Date.now();
    (document.head || document.documentElement).appendChild(s);
  }

  var src = STORAGE_BASE + "/deployer-en/index.html?v=" + Date.now();
  fetch(src, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(String(res.status));
      return res.text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
      document.body.classList.add("humateck-open-practice");
      bootHumateckAnalytics();
    })
    .catch(function () {
      document.body.innerHTML =
        '<p style="color:#e6e0d4;font-family:Arial,sans-serif;padding:24px;text-align:center">Could not load the practice tool. ' +
        '<a href="mailto:support@humateck.com" style="color:#6ca6ff">support@humateck.com</a></p>';
    });
})();
  </script>
</body>
</html>
