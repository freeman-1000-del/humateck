<title>인기 상품 검색 키워드 100선</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07080b;--s1:#0f1116;--s2:#161a22;--s3:#1d2230;--border:#1e2535;--accent:#f5a623;--green:#2dd4a0;--blue:#5b9cf6;--purple:#9b7ff4;--red:#e8534a;--text:#d8dce8;--muted:#4e5668}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.8rem;border-bottom:1px solid var(--border);background:rgba(7,8,11,.97);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:#000}
.logo-text{font-family:'Space Mono',monospace;font-size:13px;font-weight:700}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px}

/* 카테고리 탭 */
.cat-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--s1);padding:0 1.5rem;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.ctab{padding:10px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .18s;white-space:nowrap;flex-shrink:0;user-select:none}
.ctab:hover{color:var(--text)}
.ctab.on{color:var(--accent);border-bottom-color:var(--accent)}

.wrap{max-width:1100px;margin:0 auto;padding:1.5rem}

/* 검색 + 언어 */
.top-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-input{flex:1;min-width:160px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.filter-input:focus{border-color:var(--accent)}
.filter-input::placeholder{color:var(--muted)}
.lang-sel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;cursor:pointer}
.btn-copy-all{background:var(--accent);border:none;color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-copy-all:hover{opacity:.85}

/* 통계 */
.stat-row{display:flex;align-items:center;gap:12px;margin-bottom:1rem;font-size:13px;color:var(--muted)}
.stat-num{font-family:'Space Mono',monospace;color:var(--accent);font-weight:700}

/* 키워드 그리드 */
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.kw-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;transition:border-color .18s;cursor:pointer;position:relative}
.kw-card:hover{border-color:rgba(245,166,35,.4);background:var(--s2)}
.kw-num{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:5px}
.kw-text{font-size:15px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.4}
.kw-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.kw-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.tag-time{background:rgba(45,212,160,.12);color:var(--green);border:1px solid rgba(45,212,160,.25)}
.tag-target{background:rgba(155,127,244,.12);color:var(--purple);border:1px solid rgba(155,127,244,.25)}
.tag-type{background:rgba(245,166,35,.12);color:var(--accent);border:1px solid rgba(245,166,35,.25)}
.tag-platform{background:rgba(91,156,246,.12);color:var(--blue);border:1px solid rgba(91,156,246,.25)}
.kw-actions{display:flex;gap:6px}
.btn-google{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;text-decoration:none;border:1px solid rgba(91,156,246,.3);color:var(--blue);background:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-google:hover{background:rgba(91,156,246,.08)}
.btn-img{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;text-decoration:none;border:1px solid rgba(45,212,160,.3);color:var(--green);background:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-img:hover{background:rgba(45,212,160,.08)}
.btn-yt{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;text-decoration:none;border:1px solid rgba(232,83,74,.3);color:var(--red);background:none;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-yt:hover{background:rgba(232,83,74,.08)}
.btn-cp{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11px;border:1px solid var(--border);color:var(--muted);background:none;cursor:pointer;font-family:inherit;transition:all .15s;margin-left:auto}
.btn-cp:hover{border-color:var(--accent);color:var(--accent)}

.empty{text-align:center;padding:4rem;color:var(--muted)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--s3);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;border:1px solid var(--border);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>

// ── 상태 ─────────────────────────────────────────
var curCat = 'all';
var curLang = 'en';
var filterText = '';

// ── 이벤트 ───────────────────────────────────────
document.getElementById('catBar').addEventListener('click', function(e){
  var tab = e.target.closest('.ctab');
  if(!tab) return;
  document.querySelectorAll('.ctab').forEach(function(t){t.classList.remove('on');});
  tab.classList.add('on');
  curCat = tab.getAttribute('data-cat');
  render();
});

document.getElementById('langSel').addEventListener('change', function(){
  curLang = this.value;
  render();
});

document.getElementById('filterInput').addEventListener('input', function(){
  filterText = this.value.trim().toLowerCase();
  render();
});

document.getElementById('btnCopyAll').addEventListener('click', function(){
  var visible = getFiltered();
  var texts = visible.map(function(kw){ return kw[curLang] || kw.en; });
  navigator.clipboard.writeText(texts.join('\n')).then(function(){
    toast('✓ '+texts.length+'개 키워드 복사 완료');
  });
});

// ── 필터 ─────────────────────────────────────────
function getFiltered(){
  return KEYWORDS.filter(function(kw){
    var matchCat = curCat === 'all' || kw.cat === curCat;
    var kwText = (kw[curLang] || kw.en || '').toLowerCase();
    var matchFilter = !filterText || kwText.includes(filterText) ||
      (kw.ko||'').toLowerCase().includes(filterText) ||
      (kw.en||'').toLowerCase().includes(filterText);
    return matchCat && matchFilter;
  });
}

// ── 렌더링 ───────────────────────────────────────
function render(){
  var filtered = getFiltered();
  document.getElementById('statNum').textContent = filtered.length;
  var grid = document.getElementById('kwGrid');

  if(!filtered.length){
    grid.innerHTML = '<div class="empty"><div style="font-size:36px;opacity:.2;margin-bottom:.8rem">🔍</div><div style="font-size:14px;color:var(--text)">검색 결과가 없습니다</div></div>';
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(function(kw, i){
    var card = document.createElement('div');
    card.className = 'kw-card';

    var kwText = kw[curLang] || kw.en;
    var q = encodeURIComponent(kwText);

    // 번호
    var num = document.createElement('div');
    num.className = 'kw-num';
    num.textContent = '#' + (KEYWORDS.indexOf(kw)+1);
    card.appendChild(num);

    // 키워드 텍스트
    var txt = document.createElement('div');
    txt.className = 'kw-text';
    txt.textContent = kwText;
    card.appendChild(txt);

    // 영어 (다른 언어 선택 시)
    if(curLang !== 'en'){
      var sub = document.createElement('div');
      sub.className = 'kw-sub';
      sub.textContent = kw.en;
      card.appendChild(sub);
    }

    // 태그
    var tags = document.createElement('div');
    tags.className = 'kw-tags';
    var catColors = {realtime:'tag-time', weekly:'tag-time', monthly:'tag-time', age:'tag-target', gender:'tag-target', viral:'tag-type', platform:'tag-platform', lifestyle:'tag-type', season:'tag-time'};
    (kw.tags||[]).forEach(function(t){
      var tag = document.createElement('span');
      tag.className = 'tag ' + (catColors[kw.cat]||'tag-type');
      tag.textContent = t;
      tags.appendChild(tag);
    });
    card.appendChild(tags);

    // 액션 버튼들
    var actions = document.createElement('div');
    actions.className = 'kw-actions';

    var btnG = document.createElement('a');
    btnG.className = 'btn-google';
    btnG.href = 'https://www.google.com/search?q=' + q;
    btnG.target = '_blank';
    btnG.rel = 'noopener';
    btnG.textContent = '🔍 검색';
    actions.appendChild(btnG);

    var btnI = document.createElement('a');
    btnI.className = 'btn-img';
    btnI.href = 'https://images.google.com/search?q=' + q + '&tbm=isch';
    btnI.target = '_blank';
    btnI.rel = 'noopener';
    btnI.textContent = '🖼 이미지';
    actions.appendChild(btnI);

    var btnY = document.createElement('a');
    btnY.className = 'btn-yt';
    btnY.href = 'https://www.youtube.com/results?search_query=' + q;
    btnY.target = '_blank';
    btnY.rel = 'noopener';
    btnY.textContent = '▶ YouTube';
    actions.appendChild(btnY);

    var btnC = document.createElement('button');
    btnC.className = 'btn-cp';
    btnC.textContent = '📋 복사';
    (function(text){
      btnC.addEventListener('click', function(e){
        e.stopPropagation();
        navigator.clipboard.writeText(text).then(function(){toast('복사됨: ' + text);});
      });
    })(kwText);
    actions.appendChild(btnC);

    card.appendChild(actions);

    // 카드 클릭 → Google 검색
    card.addEventListener('click', function(){
      window.open('https://www.google.com/search?q=' + q, '_blank');
    });

    grid.appendChild(card);
  });
}

var _tt;
function toast(m){
  document.querySelectorAll('.toast').forEach(function(t){t.remove();});
  var t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);clearTimeout(_tt);_tt=setTimeout(function(){t.remove();},2500);
}

// 초기 렌더
render();
</script>
