<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korea Abroad Scouter — Foreign YouTube about Korea</title>
<meta name="description" content="Find YouTube videos about Korea from foreign markets (US, JP, EU, and more). Long-form and Shorts search by region.">
<link rel="canonical" href="https://contentscouter.com/korea-abroad.html">
<script>
  window.HUMATECK_CONFIG = {
    SUPABASE_URL: 'https://ajvtyotblrtexcxuazqm.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_cmn9eVnnvaAjXVJWa6bRQA_qrb1xglQ',
    KOREA_ABROAD_SEARCH_URL: 'https://ajvtyotblrtexcxuazqm.supabase.co/functions/v1/korea-abroad-search'
  };
</script>
<style>
  :root{
    --bg:#0d0f14; --panel:#161922; --line:#2a2f3c;
    --txt:#eef1f6; --sub:#aeb6c4; --accent:#ffb454; --good:#46d39a; --bad:#ff8b8b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;
    line-height:1.5;padding:24px 16px 64px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:28px;margin:8px 0 6px;color:var(--accent)}
  .lead{color:var(--sub);margin-bottom:18px;font-size:15px}
  .panel{
    border:1px solid var(--line);border-radius:16px;background:var(--panel);
    padding:16px;margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:700}
  input,select{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0f131a;color:var(--txt);font-size:15px;
  }
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:800px){.row{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    border:1px solid var(--line);background:#121722;color:var(--txt);
    border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .btn{
    border:1px solid var(--accent);background:linear-gradient(180deg,#5c4315,#1a140a);
    color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:14px;
  }
  .btn.secondary{border-color:var(--line);background:#121722}
  .note{margin-top:10px;font-size:13px;color:var(--sub)}
  .note b{color:var(--accent)}
  .err{color:var(--bad)}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;
  }
  .card{
    display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#121722;
  }
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
  .card .body{padding:10px 12px}
  .card .t{font-size:14px;font-weight:800;line-height:1.35;margin-bottom:6px}
  .card .m{font-size:12px;color:var(--sub)}
  .state{padding:28px;text-align:center;color:var(--sub)}
  .spin{
    width:28px;height:28px;border-radius:50%;margin:0 auto 10px;
    border:3px solid #333;border-top-color:var(--accent);animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .topnav{margin-bottom:10px}
  .topnav a{color:var(--accent);font-weight:800;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav"><a href="/scouter.html">← Content Scouter</a></div>
  <h1>Korea Abroad Scouter</h1>
  <p class="lead">YouTube only — find videos about Korea that surface in foreign markets (not a full web/blog crawl). Each search uses about 101 API units.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="pin">Access PIN (4 digits)</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="****" autocomplete="off">
      </div>
      <div>
        <label for="region">Foreign market (region)</label>
        <select id="region">
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="JP">Japan</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
          <option value="ES">Spain</option>
          <option value="IT">Italy</option>
          <option value="BR">Brazil</option>
          <option value="IN">India</option>
          <option value="ID">Indonesia</option>
          <option value="VN">Vietnam</option>
          <option value="MX">Mexico</option>
        </select>
      </div>
      <div>
        <label for="period">Published within</label>
        <select id="period">
          <option value="0">Any time</option>
          <option value="7">7 days</option>
          <option value="30">30 days</option>
          <option value="365">1 year</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px">
      <label for="q">Keyword (Korea-related)</label>
      <input id="q" type="text" value="Korea" placeholder="e.g. Korean food, Seoul travel, K-pop">
    </div>
    <div class="chips" id="presets"></div>
    <div class="actions">
      <button class="btn" type="button" id="btnLong">Search Long-form</button>
      <button class="btn secondary" type="button" id="btnShorts">Search Shorts</button>
      <button class="btn secondary" type="button" id="btnCsv">Download CSV</button>
    </div>
    <p class="note" id="apiNote">Ready. Pick a foreign region + keyword, then search.</p>
  </div>

  <div id="content"><div class="state">No results yet.</div></div>
</div>

<script>
(function(){
  var CFG = window.HUMATECK_CONFIG || {};
  var SEARCH_URL = CFG.KOREA_ABROAD_SEARCH_URL || (CFG.SUPABASE_URL + '/functions/v1/korea-abroad-search');
  var ANON = CFG.SUPABASE_ANON_KEY || '';
  var lastRows = [];

  var PRESETS = [
    'Korea','Korean food','Seoul travel','K-pop','Korean culture',
    'Visit Korea','Korean street food','Life in Korea','Korean drama','Hangul'
  ];

  var presetsEl = document.getElementById('presets');
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = p;
    b.addEventListener('click', function(){
      document.getElementById('q').value = p;
      presetsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
      b.classList.add('on');
    });
    presetsEl.appendChild(b);
  });

  function fmt(n){
    n = Number(n) || 0;
    if(n >= 1e9) return (n/1e9).toFixed(1) + 'B';
    if(n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if(n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return String(n);
  }
  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }
  function setNote(html, isErr){
    var el = document.getElementById('apiNote');
    el.className = 'note' + (isErr ? ' err' : '');
    el.innerHTML = html;
  }
  function getPin(){
    return String(document.getElementById('pin').value || '').trim();
  }

  function render(rows){
    lastRows = rows || [];
    var box = document.getElementById('content');
    if(!lastRows.length){
      box.innerHTML = '<div class="state">No videos matched.</div>';
      return;
    }
    box.innerHTML = '<div class="grid">' + lastRows.map(function(v){
      return '<a class="card" href="' + esc(v.youtube_url) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(v.thumbnail_url) + '" alt="">' +
        '<div class="body"><div class="t">' + esc(v.title) + '</div>' +
        '<div class="m">' + esc(v.channel) + ' · ' + fmt(v.view_count) + ' views · ' + esc(v.country_code) + '</div></div></a>';
    }).join('') + '</div>';
  }

  async function runSearch(format){
    var pin = getPin();
    if(!/^\d{4}$/.test(pin)){
      setNote('Enter a valid 4-digit Access PIN.', true);
      return;
    }
    var q = String(document.getElementById('q').value || '').trim() || 'Korea';
    var regionCode = document.getElementById('region').value;
    var periodDays = parseInt(document.getElementById('period').value, 10) || 0;
    var content = document.getElementById('content');
    content.innerHTML = '<div class="state"><div class="spin"></div><div>Searching YouTube…</div></div>';
    setNote('Searching… (~101 units)');
    try{
      var res = await fetch(SEARCH_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON,
          'Authorization': 'Bearer ' + ANON,
          'x-scouter-pin': pin
        },
        body: JSON.stringify({
          pin: pin,
          q: q,
          format: format,
          regionCode: regionCode,
          periodDays: periodDays,
          maxResults: 25
        }),
        cache: 'no-store'
      });
      var data = await res.json();
      if(!res.ok || !data.ok){
        content.innerHTML = '<div class="state">Search failed.</div>';
        setNote(esc(data.error || res.statusText), true);
        return;
      }
      setNote('<b>Used ~' + (data.apiUnits || 101) + ' units</b> · ' + esc(data.apiNote || '') + ' · ' + (data.results||[]).length + ' videos');
      render(data.results || []);
    }catch(e){
      content.innerHTML = '<div class="state">Network error.</div>';
      setNote(esc(e.message || String(e)), true);
    }
  }

  function downloadCsv(){
    if(!lastRows.length){
      setNote('No rows to export. Run a search first.', true);
      return;
    }
    var lines = [['rank','video_id','title','channel','views','region','url'].join(',')];
    lastRows.forEach(function(v){
      lines.push([
        v.rank,
        v.video_id,
        '"' + String(v.title||'').replace(/"/g,'""') + '"',
        '"' + String(v.channel||'').replace(/"/g,'""') + '"',
        v.view_count,
        v.country_code,
        v.youtube_url
      ].join(','));
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'korea-abroad-youtube.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById('btnLong').addEventListener('click', function(){ runSearch('long'); });
  document.getElementById('btnShorts').addEventListener('click', function(){ runSearch('shorts'); });
  document.getElementById('btnCsv').addEventListener('click', downloadCsv);
})();
</script>
</body>
</html>
