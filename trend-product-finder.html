<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend Product Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080b;--s1:#0f1116;--s2:#161a22;--s3:#1d2230;
  --border:#1e2535;--accent:#f5a623;--red:#e8534a;
  --green:#2dd4a0;--blue:#5b9cf6;--purple:#9b7ff4;
  --text:#d8dce8;--muted:#4e5668;
}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.8rem;border-bottom:1px solid var(--border);background:rgba(7,8,11,.97);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:#000}
.logo-text{font-family:'Space Mono',monospace;font-size:13px;font-weight:700}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px}
.live{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);background:rgba(45,212,160,.1);border:1px solid rgba(45,212,160,.25);padding:4px 12px;border-radius:20px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* REGION BAR */
.region-bar{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--s1);padding:0 1.5rem;scrollbar-width:none}
.region-bar::-webkit-scrollbar{display:none}
.rtab{padding:10px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .18s;white-space:nowrap;flex-shrink:0}
.rtab:hover{color:var(--text)}
.rtab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* MAIN */
.wrap{max-width:1200px;margin:0 auto;padding:1.5rem}

/* SEARCH BAR */
.search-row{display:flex;gap:8px;margin-bottom:1.2rem}
.search-input{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:15px;font-family:inherit;color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.btn-search{background:var(--accent);border:none;color:#000;padding:11px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-search:hover{opacity:.85}

/* STATUS */
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.status-txt{font-size:13px;color:var(--muted)}
.status-count{font-family:'Space Mono',monospace;font-size:13px;color:var(--accent)}

/* TABLE */
.table-wrap{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl thead tr{background:var(--s2);border-bottom:1px solid var(--border)}
.tbl th{padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.tbl th:first-child{width:50px;text-align:center}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
.tbl tbody tr:last-child{border-bottom:none}
.tbl tbody tr:hover{background:var(--s2)}
.tbl td{padding:12px 16px;font-size:14px;vertical-align:middle}
.tbl td:first-child{text-align:center}

/* RANK */
.rank{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted)}
.rank.top{color:var(--accent);font-weight:700}

/* PRODUCT IMAGE */
.prod-img-wrap{width:72px;height:54px;border-radius:7px;overflow:hidden;background:var(--s3);flex-shrink:0;position:relative}
.prod-img{width:100%;height:100%;object-fit:cover}
.prod-img-ph{width:72px;height:54px;border-radius:7px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);flex-shrink:0}
.img-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s3)}
.img-spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* KEYWORD */
.kw-cell{display:flex;align-items:center;gap:10px}
.kw-text{font-size:15px;font-weight:500;color:var(--text)}
.kw-traffic{font-size:12px;color:var(--muted);white-space:nowrap}
.kw-bar-wrap{width:80px;height:4px;background:var(--s3);border-radius:2px}
.kw-bar{height:4px;background:var(--accent);border-radius:2px}

/* BADGES */
.badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700;white-space:nowrap}
.badge-hot{background:rgba(255,71,87,.15);color:#ff4757;border:1px solid rgba(255,71,87,.3)}
.badge-rising{background:rgba(45,212,160,.12);color:var(--green);border:1px solid rgba(45,212,160,.3)}
.badge-new{background:rgba(91,156,246,.12);color:var(--blue);border:1px solid rgba(91,156,246,.3)}

/* LINKS */
.link-group{display:flex;gap:6px;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:500;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:var(--s2);transition:all .15s;white-space:nowrap;cursor:pointer}
.link-btn:hover{border-color:var(--accent);color:var(--accent)}
.link-btn.google{border-color:rgba(91,156,246,.3);color:var(--blue)}
.link-btn.google:hover{background:rgba(91,156,246,.08)}
.link-btn.amazon{border-color:rgba(245,166,35,.3);color:var(--accent)}
.link-btn.amazon:hover{background:rgba(245,166,35,.08)}
.link-btn.youtube{border-color:rgba(232,83,74,.3);color:#e8534a}
.link-btn.youtube:hover{background:rgba(232,83,74,.08)}
.link-btn.shorts{border-color:rgba(155,127,244,.3);color:var(--purple)}
.link-btn.shorts:hover{background:rgba(155,127,244,.08)}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:7px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-row td{padding:14px 16px}

/* EMPTY */
.empty{text-align:center;padding:4rem;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:1rem;opacity:.2}

/* PROGRESS */
.progress-wrap{margin-bottom:1rem;display:none}
.progress-txt{font-size:12px;color:var(--muted);margin-bottom:5px}
.progress-bar{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--s3);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;border:1px solid var(--border);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}

/* IMAGE MODAL */
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem}
.img-modal.open{display:flex}
.img-modal-inner{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:600px;width:100%}
.img-modal-title{font-size:16px;font-weight:600;margin-bottom:1rem;color:var(--accent)}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.img-grid img:hover{border-color:var(--accent)}
.img-grid img.selected{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px}
.btn-modal-close{flex:1;background:none;border:1px solid var(--border);color:var(--muted);padding:9px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.btn-modal-select{flex:2;background:var(--accent);border:none;color:#000;padding:9px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700}
</style>
</head>
<body>

<!-- IMAGE SELECT MODAL -->
<div class="img-modal" id="imgModal">
  <div class="img-modal-inner">
    <div class="img-modal-title" id="imgModalTitle">이미지 선택</div>
    <div class="img-grid" id="imgGrid"></div>
    <div class="modal-btns">
      <button class="btn-modal-close" onclick="closeImgModal()">닫기</button>
      <button class="btn-modal-select" onclick="selectImg()">✓ 이 이미지 사용</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-mark">TPF</div>
    <div>
      <div class="logo-text">TREND PRODUCT FINDER</div>
      <div class="logo-sub">Google Trends + Image Auto Search</div>
    </div>
  </div>
  <div class="live"><span class="live-dot"></span>LIVE</div>
</header>

<!-- REGION TABS -->
<div class="region-bar" id="regionBar">
  <div class="rtab active" onclick="setRegion(this,'US')">🇺🇸 미국</div>
  <div class="rtab" onclick="setRegion(this,'KR')">🇰🇷 한국</div>
  <div class="rtab" onclick="setRegion(this,'JP')">🇯🇵 일본</div>
  <div class="rtab" onclick="setRegion(this,'GB')">🇬🇧 영국</div>
  <div class="rtab" onclick="setRegion(this,'DE')">🇩🇪 독일</div>
  <div class="rtab" onclick="setRegion(this,'FR')">🇫🇷 프랑스</div>
  <div class="rtab" onclick="setRegion(this,'IN')">🇮🇳 인도</div>
  <div class="rtab" onclick="setRegion(this,'BR')">🇧🇷 브라질</div>
  <div class="rtab" onclick="setRegion(this,'AU')">🇦🇺 호주</div>
  <div class="rtab" onclick="setRegion(this,'CA')">🇨🇦 캐나다</div>
  <div class="rtab" onclick="setRegion(this,'MX')">🇲🇽 멕시코</div>
  <div class="rtab" onclick="setRegion(this,'ID')">🇮🇩 인도네시아</div>
</div>

<div class="wrap">

  <!-- 검색 -->
  <div class="search-row">
    <input class="search-input" id="searchInput" placeholder="키워드 직접 입력 (비워두면 Google Trends 자동 수집)..." onkeydown="if(event.key==='Enter')loadTrends()">
    <button class="btn-search" onclick="loadTrends()">🔍 트렌드 파인더 실행</button>
  </div>

  <!-- 진행바 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-txt" id="progressTxt">Google Trends 수집 중...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- 상태 -->
  <div class="status-bar">
    <div class="status-txt" id="statusTxt">지역을 선택하고 실행하세요</div>
    <div class="status-count" id="statusCount"></div>
  </div>

  <!-- 테이블 -->
  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>#</th>
          <th>이미지</th>
          <th>트렌드 키워드</th>
          <th>검색량</th>
          <th>상태</th>
          <th>바로가기 링크</th>
        </tr>
      </thead>
      <tbody id="trendBody">
        <tr>
          <td colspan="6">
            <div class="empty">
              <div class="empty-icon">🌍</div>
              <div style="font-size:15px;color:var(--text);margin-bottom:6px">지역 선택 후 실행하세요</div>
              <div style="font-size:13px">Google Trends 실시간 급상승 키워드와 제품 이미지를 자동 수집합니다</div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
// ── 상태 ─────────────────────────────────────────
var region = 'US';
var trendData = [];
var selectedImgEl = null;
var currentRowIdx = -1;

// CORS 프록시
var PROXIES = [
  function(u){return 'https://corsproxy.io/?'+encodeURIComponent(u);},
  function(u){return 'https://api.allorigins.win/get?url='+encodeURIComponent(u);}
];

// ── 지역 설정 ─────────────────────────────────────
function setRegion(el, r){
  region = r;
  document.querySelectorAll('.rtab').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  loadTrends();
}

// ── 메인 실행 ─────────────────────────────────────
async function loadTrends(){
  var manualKw = document.getElementById('searchInput').value.trim();
  trendData = [];
  showSkel();
  setStatus('Google Trends 수집 중...', '');
  showProgress(true, 0, 100);

  var keywords = [];

  if(manualKw){
    // 수동 키워드 입력
    keywords = manualKw.split(',').map(function(k){return{title:k.trim(), traffic:'입력 키워드', pct:100};});
  } else {
    // Google Trends RSS 자동 수집
    keywords = await fetchGoogleTrends();
  }

  if(!keywords.length){
    showEmpty('Google Trends 데이터를 불러올 수 없습니다. 키워드를 직접 입력해보세요.');
    showProgress(false);
    return;
  }

  setStatus('이미지 자동 검색 중...', keywords.length+'개 키워드');
  showProgress(true, 30, 100);

  // 이미지 검색 (병렬)
  var done = 0;
  await Promise.allSettled(keywords.map(async function(kw, i){
    try{
      var img = await fetchGoogleImage(kw.title);
      trendData.push({
        rank: i+1,
        keyword: kw.title,
        traffic: kw.traffic,
        pct: kw.pct||50,
        image: img,
        images: []
      });
    }catch(e){
      trendData.push({rank:i+1, keyword:kw.title, traffic:kw.traffic, pct:kw.pct||50, image:'', images:[]});
    }
    done++;
    showProgress(true, 30+Math.round(done/keywords.length*70), 100);
  }));

  // 순서 정렬
  trendData.sort(function(a,b){return a.rank-b.rank;});
  showProgress(false);
  renderTable();
  setStatus('수집 완료', trendData.length+'개 제품');
}

// ── Google Trends RSS ─────────────────────────────
async function fetchGoogleTrends(){
  var url = 'https://trends.google.com/trends/trendingsearches/daily/rss?geo='+region;
  for(var i=0; i<PROXIES.length; i++){
    try{
      var r = await fetchWithTimeout(PROXIES[i](url), 8000);
      var text = await r.text();
      var xmlStr = text;
      try{var j=JSON.parse(text);if(j.contents)xmlStr=j.contents;}catch(e){}
      var xml = new DOMParser().parseFromString(xmlStr,'application/xml');
      var items = xml.querySelectorAll('item');
      if(!items.length) continue;
      var kws = [];
      items.forEach(function(item, idx){
        if(idx >= 20) return;
        var title = item.querySelector('title')?.textContent||'';
        var traffic = item.querySelector('approx_traffic')?.textContent||'';
        if(title) kws.push({title:title, traffic:traffic, pct:Math.max(20,100-idx*5)});
      });
      if(kws.length) return kws;
    }catch(e){continue;}
  }
  return [];
}

// ── Google 이미지 검색 ────────────────────────────
// Google Custom Search API (무료 하루 100회)
// API 키 없이도 비공식 방식으로 이미지 URL 획득
async function fetchGoogleImage(keyword){
  // 방법 1: Google 이미지 검색 결과에서 첫 번째 이미지 URL 파싱
  var searchUrl = 'https://www.google.com/search?q='+encodeURIComponent(keyword+' product')+'&tbm=isch&num=1';
  for(var i=0; i<PROXIES.length; i++){
    try{
      var r = await fetchWithTimeout(PROXIES[i](searchUrl), 6000);
      var text = await r.text();
      var xmlStr = text;
      try{var j=JSON.parse(text);if(j.contents)xmlStr=j.contents;}catch(e){}
      // 이미지 URL 추출 (Google 이미지 결과에서)
      var matches = xmlStr.match(/https?:\/\/[^"'\s]+\.(?:jpg|jpeg|png|webp)[^"'\s]*/gi);
      if(matches && matches.length){
        // 구글 자체 도메인 제외하고 첫 번째 이미지
        var filtered = matches.filter(function(u){
          return !u.includes('google.com') && !u.includes('gstatic.com') && u.length < 300;
        });
        if(filtered.length) return filtered[0];
      }
    }catch(e){continue;}
  }
  return '';
}

// ── 이미지 여러 장 검색 (모달용) ──────────────────
async function fetchGoogleImages(keyword){
  var searchUrl = 'https://www.google.com/search?q='+encodeURIComponent(keyword+' product buy')+'&tbm=isch&num=9';
  for(var i=0; i<PROXIES.length; i++){
    try{
      var r = await fetchWithTimeout(PROXIES[i](searchUrl), 6000);
      var text = await r.text();
      var xmlStr = text;
      try{var j=JSON.parse(text);if(j.contents)xmlStr=j.contents;}catch(e){}
      var matches = xmlStr.match(/https?:\/\/[^"'\s]+\.(?:jpg|jpeg|png|webp)[^"'\s]*/gi);
      if(matches){
        return matches.filter(function(u){
          return !u.includes('google.com') && !u.includes('gstatic.com') && u.length < 300;
        }).slice(0,9);
      }
    }catch(e){continue;}
  }
  return [];
}

// ── 테이블 렌더링 ─────────────────────────────────
function renderTable(){
  if(!trendData.length){showEmpty('데이터가 없습니다');return;}

  var html = trendData.map(function(item, i){
    var rankClass = i<3?'rank top':'rank';
    var imgHtml = item.image
      ? '<img class="prod-img" src="'+escH(item.image)+'" onerror="this.parentNode.innerHTML=\'<div class=prod-img-ph>📦</div>\'">'
      : '<div class="prod-img-ph">📦</div>';

    // 배지
    var badge = '';
    if(i===0) badge='<span class="badge badge-hot">🔥 HOT</span>';
    else if(i<5) badge='<span class="badge badge-rising">↑ RISING</span>';
    else badge='<span class="badge badge-new">NEW</span>';

    // 링크들
    var q = encodeURIComponent(item.keyword);
    var links =
      '<a class="link-btn google" href="https://www.google.com/search?q='+q+'+product" target="_blank">🔍 Google</a>'+
      '<a class="link-btn google" href="https://images.google.com/search?q='+q+'&tbm=isch" target="_blank">🖼 이미지</a>'+
      '<a class="link-btn amazon" href="https://www.amazon.com/s?k='+q+'" target="_blank">📦 Amazon</a>'+
      '<a class="link-btn youtube" href="https://www.youtube.com/results?search_query='+q+'+review" target="_blank">▶ YouTube</a>'+
      '<a class="link-btn shorts" href="https://www.youtube.com/results?search_query='+q+'+shorts" target="_blank">⚡ Shorts</a>';

    return '<tr>'+
      '<td><div class="'+rankClass+'">#'+(i+1)+'</div></td>'+
      '<td>'+
        '<div class="prod-img-wrap" onclick="openImgModal('+i+',\''+escJ(item.keyword)+'\')" title="이미지 변경">'+
          imgHtml+
        '</div>'+
      '</td>'+
      '<td>'+
        '<div class="kw-cell">'+
          '<div>'+
            '<div class="kw-text">'+escH(item.keyword)+'</div>'+
            '<div class="kw-bar-wrap" style="margin-top:4px"><div class="kw-bar" style="width:'+item.pct+'%"></div></div>'+
          '</div>'+
        '</div>'+
      '</td>'+
      '<td><span class="kw-traffic">'+escH(item.traffic)+'</span></td>'+
      '<td>'+badge+'</td>'+
      '<td><div class="link-group">'+links+'</div></td>'+
    '</tr>';
  }).join('');

  document.getElementById('trendBody').innerHTML = html;
}

// ── 이미지 모달 ────────────────────────────────────
async function openImgModal(idx, keyword){
  currentRowIdx = idx;
  selectedImgEl = null;
  document.getElementById('imgModalTitle').textContent = '🖼 "'+keyword+'" 이미지 선택';
  document.getElementById('imgGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)"><div class="img-spinner" style="margin:0 auto .5rem"></div>이미지 검색 중...</div>';
  document.getElementById('imgModal').classList.add('open');

  var imgs = await fetchGoogleImages(keyword);
  if(!imgs.length){
    document.getElementById('imgGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:1rem;color:var(--muted)">이미지를 찾을 수 없습니다</div>';
    return;
  }
  document.getElementById('imgGrid').innerHTML = imgs.map(function(url){
    return '<img src="'+escH(url)+'" onerror="this.style.display=\'none\'" onclick="selectThisImg(this)">';
  }).join('');
}

function selectThisImg(el){
  document.querySelectorAll('.img-grid img').forEach(function(i){i.classList.remove('selected');});
  el.classList.add('selected');
  selectedImgEl = el;
}

function selectImg(){
  if(!selectedImgEl){toast('이미지를 선택해주세요');return;}
  if(currentRowIdx>=0 && trendData[currentRowIdx]){
    trendData[currentRowIdx].image = selectedImgEl.src;
    renderTable();
  }
  closeImgModal();
  toast('✓ 이미지가 변경되었습니다');
}

function closeImgModal(){
  document.getElementById('imgModal').classList.remove('open');
  selectedImgEl = null;
}
document.getElementById('imgModal').addEventListener('click', function(e){
  if(e.target.id==='imgModal') closeImgModal();
});

// ── 유틸 ──────────────────────────────────────────
function showSkel(){
  var html = '';
  for(var i=0;i<15;i++){
    html += '<tr class="skel-row">'+
      '<td><div class="skel" style="width:24px;height:16px"></div></td>'+
      '<td><div class="skel" style="width:72px;height:54px;border-radius:7px"></div></td>'+
      '<td><div class="skel" style="width:160px;height:16px"></div></td>'+
      '<td><div class="skel" style="width:60px;height:14px"></div></td>'+
      '<td><div class="skel" style="width:50px;height:20px;border-radius:8px"></div></td>'+
      '<td><div class="skel" style="width:280px;height:28px;border-radius:7px"></div></td>'+
    '</tr>';
  }
  document.getElementById('trendBody').innerHTML = html;
}

function showEmpty(msg){
  document.getElementById('trendBody').innerHTML =
    '<tr><td colspan="6"><div class="empty"><div class="empty-icon">⚠️</div><div style="font-size:14px;color:var(--text);margin-bottom:6px">'+escH(msg)+'</div></div></td></tr>';
}

function showProgress(show, val, max){
  document.getElementById('progressWrap').style.display = show?'block':'none';
  if(show) document.getElementById('progressFill').style.width = Math.round(val/max*100)+'%';
}

function setStatus(txt, count){
  document.getElementById('statusTxt').textContent = txt;
  document.getElementById('statusCount').textContent = count;
}

async function fetchWithTimeout(url, ms){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ctrl.abort();}, ms);
  try{
    var r = await fetch(url, {signal:ctrl.signal});
    clearTimeout(t);
    return r;
  }catch(e){clearTimeout(t);throw e;}
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escJ(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
var _tt;
function toast(m){
  document.querySelectorAll('.toast').forEach(function(t){t.remove();});
  var t=document.createElement('div');t.className='toast';t.textContent=m;
  document.body.appendChild(t);clearTimeout(_tt);_tt=setTimeout(function(){t.remove();},2500);
}

// ── 초기 실행 ─────────────────────────────────────
loadTrends();
</script>
