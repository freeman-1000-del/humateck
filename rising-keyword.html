<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rising Keyword Tool | Humateck</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#050b14;color:#f4f1e8;font-family:Arial,"Noto Sans KR",sans-serif}
    .wrap{width:880px;max-width:calc(100vw - 40px);margin:0 auto;padding:38px 0 52px}
    .card{border:1px solid rgba(214,176,78,.72);border-radius:22px;background:linear-gradient(180deg,rgba(20,28,37,.96),rgba(13,19,26,.98));padding:24px 26px}
    h1{margin:0 0 10px;color:#ffd95a}
    p{line-height:1.72;color:#e6e0d4}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border:2px solid #d9b256;border-radius:12px;color:#fff;font-size:14px;font-weight:800;background:linear-gradient(180deg,#5c4315,#15110a);text-decoration:none}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Rising Keyword Tool</h1>
      <p>This tool page is now reserved and ready. The full keyword workflow will be connected next.</p>
      <p><a class="btn" href="/">Back to Tools Plaza</a></p>
    </section>
  </main>
</body>
</html>
